<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinkje — beheer</title>
<style>
  :root {
    --bg: #f4f5f3; --card: #fff; --border: #e1e3df; --text: #161a17;
    --dim: #5a605b; --accent: #14445f; --on-accent: #fff; --good: #1b6b3a;
    --warn: #8a5a00; --danger: #b3261e; --chip: #ebede9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101210; --card: #1b1e1c; --border: #2c302d; --text: #f1f3f0;
      --dim: #9ba29d; --accent: #7fb2cf; --on-accent: #101210; --good: #6fd397;
      --warn: #e0b252; --danger: #f2b8b5; --chip: #262a27;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--card);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 17px; margin: 0; }
  header .who { color: var(--dim); font-size: 13px; margin-left: auto; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button {
    background: none; border: 0; color: var(--dim); padding: 8px 12px;
    border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600;
  }
  nav button[aria-current="true"] { background: var(--chip); color: var(--text); }
  main { padding: 24px; max-width: 1000px; margin: 0 auto; }
  h2 { font-size: 20px; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 24px 0 8px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 12px;
  }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .grow { flex: 1; min-width: 180px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--dim); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--bg); color: var(--text); font: inherit;
  }
  textarea { min-height: 72px; resize: vertical; }
  button.btn {
    padding: 9px 14px; border-radius: 9px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--on-accent); font: inherit;
    font-weight: 600; cursor: pointer;
  }
  button.ghost { background: none; border-color: var(--border); color: var(--text); }
  button.danger { background: none; border-color: var(--border); color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .dim { color: var(--dim); font-size: 13px; }
  .chip {
    display: inline-block; background: var(--chip); color: var(--dim);
    border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600;
  }
  button.chip { border: 0; cursor: pointer; font-family: inherit; padding: 5px 12px; }
  button.chip.on { background: var(--accent); color: var(--on-accent); }
  .pil {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
  }
  .pil.goed { background: var(--good); color: var(--card); }
  .pil.gezakt { background: var(--danger); color: var(--card); }
  .voortgang {
    height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden;
    margin-top: 10px;
  }
  .voortgang { display: flex; }
  .voortgang > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .voortgang > i.onderweg { background: var(--warn); }
  /* Een naam in het raster. Kleiner dan een chip: er staan er twaalf op een rij. */
  .naam {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    background: var(--chip); font-size: 12px; margin: 2px 3px 0 0;
  }
  .naam.onderweg { background: var(--warn); color: var(--card); font-weight: 600; }
  .eisrij { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .eisrij:last-child { border-bottom: none; }
  .eisrij .kop { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .teller { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .teller.klaar { color: var(--good); }
  .teller.let-op { color: var(--warn); }

  /* Een kop boven een tabel: naam links, aantal rechts. */
  .groepkop { display: flex; justify-content: space-between; align-items: baseline;
              gap: 12px; margin-bottom: 6px; }
  .groepkop b { font-size: 16px; }

  /* De voortgangstabel. Verving de klappers: daar moest je per lid klikken om
     ook maar iets te zien, en vergelijken kon niet. */
  .vt { width: 100%; border-collapse: collapse; font-size: 14px; }
  .vt th { text-align: left; font-size: 12px; font-weight: 600; color: var(--dim);
           padding: 0 10px 6px 0; white-space: nowrap; }
  .vt td { padding: 10px 10px 10px 0; border-top: 1px solid var(--border);
           vertical-align: middle; }
  .vt tr.klikbaar { cursor: pointer; }
  .vt tr.klikbaar:hover td { background: var(--chip); }
  .vt .naamcel { font-weight: 600; white-space: nowrap; width: 1%; }
  .vt .speltak { font-weight: 400; color: var(--dim); font-size: 12px; display: block; }
  .vt .num { text-align: right; white-space: nowrap; width: 1%; }
  .vt .detailrij td { padding-top: 0; border-top: none; font-size: 13px; }
  .balkcel { min-width: 220px; }
  .celbalk { height: 8px; border-radius: 4px; background: var(--chip); display: flex;
             overflow: hidden; margin-bottom: 4px; }
  .celbalk > i { display: block; height: 100%; background: var(--accent); }
  .celbalk > i.onderweg { background: var(--warn); }
  .celcijfer { font-size: 12px; color: var(--dim); }
  .celcijfer.klaar { color: var(--good); font-weight: 600; }
  .keuzeregel {
    display: flex; justify-content: space-between; gap: 12px; width: 100%;
    text-align: left; font: inherit; cursor: pointer; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px;
    background: var(--card); color: var(--text);
  }
  .keuzeregel.aan { border-color: var(--accent); background: var(--chip); font-weight: 600; }
  .keuzeregel.uit { opacity: .55; cursor: default; }
  .note {
    border-left: 3px solid var(--warn); background: var(--card);
    padding: 12px 14px; border-radius: 0 10px 10px 0; margin-bottom: 16px; font-size: 13px;
  }
  .err { border-left-color: var(--danger); color: var(--danger); }
  .ok { border-left-color: var(--good); color: var(--good); }
  details { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
  details summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent); }
  .part { display: flex; gap: 8px; align-items: center; margin: 6px 0 0 16px; }
  .part input { flex: 1; }
  .num { width: 62px; flex: none; }
  #signin, #join, #newpass { max-width: 380px; margin: 12vh auto; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="signin">
  <div class="card">
    <h2>Vinkje</h2>
    <p class="dim" id="signin-lead">Beheerpagina. Log in met je account.</p>

    <div id="name-row" class="hidden" style="margin-top:12px"><label for="name">Naam</label>
      <input id="name" type="text" autocomplete="name" placeholder="Voor- en achternaam"></div>
    <div style="margin-top:12px"><label for="email">E-mailadres</label>
      <input id="email" type="email" autocomplete="username"></div>
    <div id="password-row" style="margin-top:12px"><label for="password">Wachtwoord</label>
      <input id="password" type="password" autocomplete="current-password"></div>

    <div id="signin-error" class="note err hidden" style="margin-top:12px"></div>
    <div id="signin-ok" class="note ok hidden" style="margin-top:12px"></div>

    <button class="btn" id="signin-btn" style="margin-top:16px; width:100%">Inloggen</button>
    <button class="btn ghost" id="forgot-btn" style="margin-top:8px; width:100%">
      Wachtwoord vergeten?
    </button>
    <button class="btn ghost" id="mode-btn" style="margin-top:8px; width:100%">
      Nog geen account? Maak er een
    </button>
  </div>
</div>

<!-- Na de link uit "wachtwoord vergeten". Er is dan al een sessie — die zat in
     de link — maar de pagina gaat pas verder als het nieuwe wachtwoord staat. -->
<div id="newpass" class="hidden">
  <div class="card">
    <h2>Nieuw wachtwoord</h2>
    <p class="dim" id="newpass-lead">Kies een wachtwoord van minimaal 8 tekens.</p>
    <div style="margin-top:12px"><label for="np1">Nieuw wachtwoord</label>
      <input id="np1" type="password" autocomplete="new-password"></div>
    <div style="margin-top:12px"><label for="np2">Nog een keer</label>
      <input id="np2" type="password" autocomplete="new-password"></div>
    <div id="newpass-error" class="note err hidden" style="margin-top:12px"></div>
    <button class="btn" id="newpass-btn" style="margin-top:16px; width:100%">Wachtwoord opslaan</button>
  </div>
</div>

<!-- Wie is ingelogd maar nog nergens bij hoort. Een account op zichzelf geeft
     nergens toegang toe; de code doet dat. -->
<div id="join" class="hidden">
  <div class="card">
    <h2>Code invullen</h2>
    <p class="dim">
      Je account staat klaar. Vul de code van zes tekens in die je van je groep
      kreeg, dan hoor je erbij.
    </p>
    <div style="margin-top:12px"><label for="code">Code</label>
      <input id="code" type="text" maxlength="8" autocapitalize="characters"
             style="font-size:22px; letter-spacing:4px; text-align:center"></div>
    <div id="join-error" class="note err hidden" style="margin-top:12px"></div>
    <button class="btn" id="join-btn" style="margin-top:16px; width:100%">Aanmelden bij groep</button>
    <button class="btn ghost" id="join-signout" style="margin-top:8px; width:100%">Uitloggen</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Vinkje — beheer</h1>
    <nav>
      <button data-tab="leden" aria-current="true">Leden</button>
      <button data-tab="voortgang">Voortgang</button>
      <button data-tab="codes">Codes</button>
      <button data-tab="speltakken">Speltakken</button>
      <button data-tab="bakken">Bakken</button>
      <button data-tab="catalogus">Diploma's en eisen</button>
      <button data-tab="lesmateriaal">Lesmateriaal</button>
      <button data-tab="examens">Examens</button>
    </nav>
    <span class="who" id="who"></span>
    <button class="btn ghost" id="signout">Uitloggen</button>
  </header>
  <!-- Buiten #view, want dat wordt bij elke render leeggegooid en dan zou een
       "Opgeslagen" verdwijnen op het moment dat je hem nodig hebt. -->
  <div style="max-width:1000px; margin:16px auto 0; padding:0 24px">
    <div id="say" class="note hidden"></div>
  </div>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- Relatief, niet /config.js: gehost onder scoutingjwf.nl/beheer/ zou een
     absoluut pad bij de WordPress-root uitkomen en een 404 opleveren. -->
<script src="config.js"></script>
<script>
/*
 * De beheerpagina.
 *
 * Vanilla JS met opzet: dit is één bestand dat je opent en dat het doet, zonder
 * build en zonder node_modules. De regels over wie wat mag staan niet hier maar
 * in de database — deze pagina praat met precies dezelfde policies als de app,
 * met de publishable key. Wie geen beheerder is, krijgt hier dus ook niets voor
 * elkaar, hoe hard hij ook op de knoppen drukt.
 */

const cfg = window.VINKJE ?? { url: '', key: '' };

// Uitlezen vóór createClient. supabase-js haalt de sleutels uit een link in de
// URL, maakt er een sessie van en wist daarna de hash; wat voor link het was
// is dan niet meer te zien.
const linkInfo = (() => {
  const p = new URLSearchParams(location.hash.slice(1));
  const error = p.get('error_description');
  return {
    recovery: p.get('type') === 'recovery',
    error: error ? error.replace(/\+/g, ' ') : null,
  };
})();

const db = cfg.url && cfg.key ? window.supabase.createClient(cfg.url, cfg.key) : null;

let me = null;       // { id, name, email }
let group = null;    // { id, name } — de groep waar je beheerder van bent
let tab = 'leden';

// ---------------------------------------------------------------- helpers

/**
 * Supabase gooit geen Error maar een gewoon object, dus String() erop geeft
 * "[object Object]". Zelfde reden als in de app: kijk naar de vorm.
 */
function message(e) {
  if (!e) return '';
  if (typeof e === 'string') return e;
  if (e instanceof Error && e.message) return e.message;
  const parts = [e.message, e.details, e.hint].filter((p) => typeof p === 'string' && p.trim());
  if (parts.length) return parts.join(' — ');
  try { return JSON.stringify(e); } catch { return 'Onbekende fout'; }
}

function el(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props ?? {})) {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

function field(label, value, attrs = {}) {
  const input = el(attrs.multiline ? 'textarea' : 'input', {
    value: attrs.multiline ? null : (value ?? ''),
    type: attrs.type ?? 'text',
    class: attrs.class ?? null,
  });
  if (attrs.multiline) input.value = value ?? '';
  return { wrap: el('div', { class: attrs.wrapClass ?? 'grow' }, el('label', {}, label), input), input };
}

let noteTimer = null;
function say(text, kind = 'ok') {
  const bar = document.getElementById('say');
  bar.className = `note ${kind}`;
  bar.textContent = text;
  bar.classList.remove('hidden');
  clearTimeout(noteTimer);
  if (kind === 'ok') noteTimer = setTimeout(() => bar.classList.add('hidden'), 3000);
}

async function run(fn, okText) {
  try {
    const out = await fn();
    if (okText) say(okText, 'ok');
    return out;
  } catch (e) {
    say(message(e), 'err');
    throw e;
  }
}

function check(res) {
  if (res.error) throw res.error;
  return res.data;
}

function confirmed(text) {
  return window.confirm(text);
}

/** Een aan/uit-pil. Zelfde ding als de Chip in de app. */
function chip(label, on, onclick) {
  return el('button', { class: `chip${on ? ' on' : ''}`, onclick }, label);
}

function sectionsOf(group) {
  return db.from('sections').select('*').eq('group_id', group.id)
    .order('sort_order').order('name').then(check);
}

// ---------------------------------------------------------------- inloggen

/** 'in' = inloggen, 'up' = account maken, 'reset' = wachtwoord vergeten. */
let authMode = 'in';

function paintAuthMode() {
  const up = authMode === 'up';
  const reset = authMode === 'reset';
  document.getElementById('name-row').classList.toggle('hidden', !up);
  document.getElementById('password-row').classList.toggle('hidden', reset);
  document.getElementById('forgot-btn').classList.toggle('hidden', authMode !== 'in');
  document.getElementById('signin-lead').textContent = up
    ? 'Maak een account. Daarna vul je de code in die je van je groep kreeg.'
    : reset
      ? 'Vul je e-mailadres in. Je krijgt een mail met een link om een nieuw wachtwoord te kiezen.'
      : 'Beheerpagina. Log in met je account.';
  document.getElementById('signin-btn').textContent =
    up ? 'Account maken' : reset ? 'Stuur herstellink' : 'Inloggen';
  document.getElementById('mode-btn').textContent =
    authMode === 'in' ? 'Nog geen account? Maak er een' : 'Terug naar inloggen';
  document.getElementById('password').setAttribute(
    'autocomplete', up ? 'new-password' : 'current-password');
  document.getElementById('signin-error').classList.add('hidden');
  document.getElementById('signin-ok').classList.add('hidden');
}

document.getElementById('mode-btn').addEventListener('click', () => {
  authMode = authMode === 'in' ? 'up' : 'in';
  paintAuthMode();
});

document.getElementById('forgot-btn').addEventListener('click', () => {
  authMode = 'reset';
  paintAuthMode();
});

function showNewPassword() {
  document.getElementById('signin').classList.add('hidden');
  document.getElementById('join').classList.add('hidden');
  document.getElementById('newpass').classList.remove('hidden');
  document.getElementById('np1').focus();
}

document.getElementById('newpass-btn').addEventListener('click', async () => {
  const box = document.getElementById('newpass-error');
  box.classList.add('hidden');
  const p1 = document.getElementById('np1').value;
  const p2 = document.getElementById('np2').value;

  const fout = p1.length < 8
    ? 'Kies een wachtwoord van minimaal 8 tekens.'
    : p1 !== p2
      ? 'De twee wachtwoorden zijn niet gelijk.'
      : null;
  if (fout) {
    box.textContent = fout;
    box.classList.remove('hidden');
    return;
  }

  const { error } = await db.auth.updateUser({ password: p1 });
  if (error) {
    box.textContent = message(error);
    box.classList.remove('hidden');
    return;
  }
  document.getElementById('newpass').classList.add('hidden');
  await start();
  say('Je nieuwe wachtwoord is opgeslagen.', 'ok');
});

document.getElementById('signin-btn').addEventListener('click', async () => {
  const box = document.getElementById('signin-error');
  const okBox = document.getElementById('signin-ok');
  box.classList.add('hidden');
  okBox.classList.add('hidden');

  if (!db) {
    box.textContent = 'Geen verbinding ingesteld. Draai deze pagina via "npm run admin", dan leest hij de .env van het project.';
    box.classList.remove('hidden');
    return;
  }

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (authMode === 'reset') {
    if (!email) {
      box.textContent = 'Vul je e-mailadres in.';
      box.classList.remove('hidden');
      return;
    }
    const { error } = await db.auth.resetPasswordForEmail(email, {
      // Terug naar deze pagina, lokaal of gehost. Moet in de redirect-allowlist
      // van Supabase staan; anders valt hij terug op de Site URL.
      redirectTo: location.href.split('#')[0].split('?')[0],
    });
    if (error) {
      box.textContent = message(error);
      box.classList.remove('hidden');
      return;
    }
    // Bewust dezelfde tekst of het adres bestaat of niet: anders kan iedereen
    // hier uitzoeken wie er een account heeft.
    okBox.textContent = 'Als er een account bij dit adres hoort, staat er een mail onderweg met een link om een nieuw wachtwoord te kiezen.';
    okBox.classList.remove('hidden');
    return;
  }

  if (authMode === 'up') {
    const naam = document.getElementById('name').value.trim();
    if (naam.length < 2) {
      box.textContent = 'Vul je naam in.';
      box.classList.remove('hidden');
      return;
    }
    const { data, error } = await db.auth.signUp({
      email,
      password,
      options: {
        data: { full_name: naam },
        // Anders gebruikt Supabase de Site URL uit het dashboard, en die staat
        // standaard op localhost:3000. Dit stuurt de bevestigingslink terug naar
        // deze pagina, waar hij ook vandaan kwam — lokaal of gehost, allebei goed.
        emailRedirectTo: location.href.split('#')[0].split('?')[0],
      },
    });
    if (error) {
      box.textContent = message(error);
      box.classList.remove('hidden');
      return;
    }
    // Staat "bevestig je e-mailadres" aan in Supabase, dan is er nog geen
    // sessie en moet er eerst een mailtje beantwoord worden.
    if (!data.session) {
      okBox.textContent = 'Je account is aangemaakt. Bevestig je e-mailadres en log daarna in.';
      okBox.classList.remove('hidden');
      authMode = 'in';
      paintAuthMode();
      okBox.classList.remove('hidden');
      return;
    }
  } else {
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
      box.textContent = message(error);
      box.classList.remove('hidden');
      return;
    }
  }

  await start();
});

document.getElementById('join-btn').addEventListener('click', async () => {
  const box = document.getElementById('join-error');
  box.classList.add('hidden');
  try {
    check(await db.rpc('redeem_invite', {
      p_code: document.getElementById('code').value.trim().toUpperCase(),
    }));
  } catch (e) {
    box.textContent = message(e);
    box.classList.remove('hidden');
    return;
  }
  document.getElementById('join').classList.add('hidden');
  await start();
});

document.getElementById('join-signout').addEventListener('click', async () => {
  await db.auth.signOut();
  location.reload();
});

document.getElementById('signout').addEventListener('click', async () => {
  await db.auth.signOut();
  location.reload();
});

for (const btn of document.querySelectorAll('nav button')) {
  btn.addEventListener('click', () => {
    tab = btn.dataset.tab;
    for (const b of document.querySelectorAll('nav button')) {
      b.setAttribute('aria-current', String(b === btn));
    }
    render();
  });
}

async function start() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) return;

  const profile = check(
    await db.from('profiles').select('id, full_name').eq('id', user.id).maybeSingle(),
  );
  me = { id: user.id, name: profile?.full_name ?? '', email: user.email };

  const rows = check(
    await db
      .from('memberships')
      .select('group_id, role, groups(id, name)')
      .eq('profile_id', user.id),
  );
  // Drie situaties, en ze lopen makkelijk door elkaar: nergens bij horen,
  // ergens bij horen maar geen beheerder zijn, en beheerder zijn.
  document.getElementById('signin').classList.add('hidden');

  if (rows.length === 0) {
    document.getElementById('join').classList.remove('hidden');
    return;
  }

  const admin = rows.find((r) => r.role === 'beheerder');
  if (!admin) {
    const waar = rows[0].groups?.name ?? 'je groep';
    document.getElementById('join').classList.add('hidden');
    document.getElementById('signin').classList.remove('hidden');
    document.getElementById('signin').innerHTML =
      `<div class="card"><h2>Je zit erin</h2>` +
      `<p class="dim">Je account hoort bij ${waar}. Deze beheerpagina is voor beheerders; ` +
      `voor aftekenen en leden toevoegen gebruik je de app.</p>` +
      `<p class="dim">Moet je hier wél bij kunnen, vraag een beheerder om je die rol te geven.</p></div>`;
    return;
  }

  document.getElementById('join').classList.add('hidden');
  group = { id: admin.groups.id, name: admin.groups.name };

  document.getElementById('signin').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').textContent = `${me.name || me.email} · ${group.name}`;
  render();
}

// ---------------------------------------------------------------- schermen

// Welke uitklappers openstonden, en waar je stond. Na elke opslag tekent het
// scherm zichzelf opnieuw — anders zie je een nieuwe vraag niet verschijnen —
// en zonder dit klapte alles dicht en sprong je naar de bovenkant terug.
const geopend = new Set();
let scrolStand = 0;

/**
 * Een uitklapper die onthoudt of hij openstond.
 *
 * De sleutel moet hetzelfde blijven tussen twee keer tekenen; een id uit de
 * database dus, geen volgnummer.
 */
function klapper(sleutel, kopregel) {
  const details = el('details', {});
  details.dataset.sleutel = sleutel;
  details.append(el('summary', {}, kopregel));
  if (geopend.has(sleutel)) details.open = true;
  details.addEventListener('toggle', () => {
    if (details.open) geopend.add(sleutel);
    else geopend.delete(sleutel);
  });
  return details;
}

function render() {
  if (typeof stopMeekijken === 'function') stopMeekijken();
  const view = document.getElementById('view');
  scrolStand = window.scrollY;
  view.innerHTML = '';
  // De schermen vullen zich asynchroon, dus de scrolstand komt even later terug.
  setTimeout(() => window.scrollTo({ top: scrolStand }), 120);
  if (tab === 'leden') renderLeden(view);
  else if (tab === 'voortgang') renderVoortgang(view);
  else if (tab === 'codes') renderCodes(view);
  else if (tab === 'speltakken') renderSpeltakken(view);
  else if (tab === 'bakken') renderBakken(view);
  else if (tab === 'lesmateriaal') renderLesmateriaal(view);
  else if (tab === 'examens') renderExamens(view);
  else renderCatalogus(view);
}

async function renderLeden(view) {
  view.append(el('h2', {}, 'Leden'));
  view.append(el('p', { class: 'dim' },
    'Een vaarder hoeft geen telefoon of account te hebben om hier te staan. Haal je iemand uit de groep, dan verliest hij zijn plek in de lijst maar niet zijn aftekeningen.'));

  const nieuw = field('Naam', '', {});
  view.append(el('div', { class: 'card row' }, nieuw.wrap,
    el('button', {
      class: 'btn',
      onclick: async () => {
        if (nieuw.input.value.trim().length < 2) return;
        await run(async () => check(await db.rpc('add_member', {
          p_group: group.id, p_name: nieuw.input.value.trim(),
        })), 'Lid toegevoegd');
        render();
      },
    }, 'Lid toevoegen')));

  const [rows, sections] = await Promise.all([
    run(async () => check(await db.rpc('group_members', { p_group: group.id }))),
    sectionsOf(group),
  ]);

  // Filter op speltak, zodat een instructeur met twintig namen alleen zijn
  // eigen ploeg hoeft te zien.
  let filter = null;
  const list = el('div', {});
  const filterRow = el('div', { class: 'row', style: 'margin-bottom:12px' });

  function paintFilter() {
    filterRow.innerHTML = '';
    if (!sections.length) return;
    filterRow.append(chip('Alle', filter === null, () => { filter = null; paint(); }));
    for (const s of sections) {
      filterRow.append(chip(s.name, filter === s.id, () => {
        filter = filter === s.id ? null : s.id;
        paint();
      }));
    }
  }

  function paint() {
    paintFilter();
    list.innerHTML = '';
    const shown = filter ? rows.filter((m) => (m.section_ids ?? []).includes(filter)) : rows;
    if (!shown.length) list.append(el('p', { class: 'dim' }, 'Niemand in deze speltak.'));
    for (const m of shown) list.append(memberCard(m, sections));
  }

  view.append(filterRow, list);
  paint();
  oudLeden(view);
  return;

  function memberCard(m, sections) {
    const card = el('div', { class: 'card' });
    const select = el('select', {});
    for (const r of ['lid', 'instructeur', 'beheerder']) {
      const opt = el('option', { value: r }, { lid: 'Lid', instructeur: 'Instructeur', beheerder: 'Beheerder' }[r]);
      if (m.role === r) opt.selected = true;
      select.append(opt);
    }
    select.addEventListener('change', async () => {
      await run(async () => {
        check(await db.from('memberships').update({ role: select.value })
          .eq('group_id', group.id).eq('profile_id', m.profile_id));
      }, 'Rol aangepast');
      render();
    });

    // Naam als invoerveld: wie niet inlogt kan zijn eigen naam nooit
    // rechtzetten, dus moet iemand anders dat hier kunnen.
    const naam = el('input', { value: m.full_name });
    const bewaar = el('button', {
      class: 'btn ghost',
      onclick: async () => {
        if (naam.value.trim().length < 2) return;
        await run(async () => check(await db.rpc('set_member_name', {
          p_group: group.id, p_profile: m.profile_id, p_name: naam.value.trim(),
        })), 'Naam opgeslagen');
        render();
      },
    }, 'Naam opslaan');

    card.append(el('div', { class: 'row spread' },
      el('div', { class: 'grow' },
        el('div', { class: 'row' },
          naam,
          bewaar,
          m.profile_id === me.id ? el('span', { class: 'chip' }, 'jij') : null,
        ),
        el('div', { class: 'dim', style: 'margin-top:6px' },
          `${m.in_progress} in opleiding${m.awarded ? ` · ${m.awarded} behaald` : ''}` +
          (m.sections?.length ? ` · ${m.sections.join(', ')}` : '')),
      ),
      el('div', { class: 'row' },
        el('div', { style: 'width:150px' }, select),
        el('button', {
          class: 'btn danger',
          onclick: async () => {
            if (!confirmed(`${m.full_name || 'Dit lid'} uit de groep halen?\n\nWat al afgetekend is blijft bewaard.`)) return;
            await run(async () => {
              check(await db.rpc('remove_member', { p_group: group.id, p_profile: m.profile_id }));
            }, 'Uit de groep gehaald');
            render();
          },
        }, 'Verwijderen'),
      ),
    ));

    if (sections.length) {
      const chips = el('div', { class: 'row', style: 'margin-top:10px; gap:6px' },
        el('span', { class: 'dim', style: 'margin-right:4px' }, 'Speltakken:'));
      for (const s of sections) {
        const on = (m.section_ids ?? []).includes(s.id);
        chips.append(chip(s.name, on, async () => {
          // De hele set gaat mee, niet het verschil — zo kan er niets
          // halverwege blijven hangen.
          const next = on
            ? (m.section_ids ?? []).filter((id) => id !== s.id)
            : [...(m.section_ids ?? []), s.id];
          await run(async () => check(await db.rpc('set_member_sections', {
            p_group: group.id, p_profile: m.profile_id, p_sections: next,
          })), 'Speltakken bijgewerkt');
          render();
        }));
      }
      card.append(chips);
    }

    return card;
  }
}

// ---- Oud-leden
//
// Wie uit de groep gehaald wordt, houdt zijn aftekeningen. Dat is met opzet en
// staat zo in het privacybeleid: een seizoen overslaan hoort niet te betekenen
// dat je opnieuw begint. Maar bewaren wat niemand kan zien is het slechtste van
// twee werelden -- de gegevens staan er, niemand weet het, en na de beloofde
// twee jaar ruimt niemand ze op. Daarom staan ze hier, met de datum erbij.

async function oudLeden(view) {
  const rijen = await run(async () => check(
    await db.rpc('former_members', { p_group: group.id })));
  if (!rijen.length) return;

  const verlopen = rijen.filter((r) => r.over_de_tijd);
  const doos = el('div', { class: 'card' });
  doos.append(el('h3', {}, 'Niet meer in de groep'));
  doos.append(el('p', { class: 'dim' },
    'Deze mensen staan niet meer in de ledenlijst, maar hun aftekeningen zijn bewaard ' +
    'zodat ze bij terugkeer verder kunnen waar ze waren. Voeg je iemand opnieuw toe, ' +
    'dan staat zijn lijst er weer. Het privacybeleid belooft dat we na twee jaar ' +
    'opruimen; dat gaat niet vanzelf, dus dat is deze knop.'));

  if (verlopen.length) {
    doos.append(el('p', { class: 'teller' },
      verlopen.length === 1
        ? 'Van één persoon staat het er langer dan twee jaar.'
        : 'Van ' + verlopen.length + ' mensen staat het er langer dan twee jaar.'));
  }

  for (const r of rijen) {
    const rij = el('div', { class: 'eisrij' });
    rij.append(el('div', { class: 'kop' },
      el('span', {}, el('b', {}, r.full_name),
        el('span', { class: 'dim' },
          ' ' + r.opleidingen + (Number(r.opleidingen) === 1 ? ' opleiding' : ' opleidingen') +
          ', ' + r.aftekeningen + (Number(r.aftekeningen) === 1 ? ' aftekening' : ' aftekeningen'))),
      el('span', { class: 'teller' + (r.over_de_tijd ? ' let-op' : '') },
        'weg sinds ' + datumKort(r.left_at))));

    rij.append(el('button', {
      class: 'btn danger',
      style: 'margin-top:8px',
      onclick: async () => {
        if (!confirmed(
          'Alle aftekeningen van ' + r.full_name + ' in deze groep weggooien?\n\n' +
          'Dit kan niet ongedaan gemaakt worden. Komt hij later terug, dan begint ' +
          'hij opnieuw.')) return;
        await run(async () => check(await db.rpc('delete_member_progress', {
          p_group: group.id, p_profile: r.profile_id,
        })), 'Gegevens van ' + r.full_name + ' verwijderd');
        render();
      },
    }, 'Gegevens verwijderen'));
    doos.append(rij);
  }
  view.append(doos);
}

// ---- Lesmateriaal
//
// Bestanden die een vaarder erbij wil hebben als hij voor een diploma leert.
// Ze staan in een afgeschermde map: alleen wie in de groep zit krijgt een link,
// en die link verloopt. Dat is strenger dan bij de examenplaatjes, met reden --
// lesmateriaal is vaak van iemand anders gemaakt.

let lesDiploma = null;   // waar een nieuwe upload bij hoort; null = algemeen

function bytesKort(n) {
  if (!n) return null;
  return n >= 1048576
    ? (n / 1048576).toFixed(1) + ' MB'
    : Math.max(1, Math.round(n / 1024)) + ' kB';
}

async function renderLesmateriaal(view) {
  view.append(el('h2', {}, 'Lesmateriaal'));
  view.append(el('p', { class: 'dim' },
    'Lesboeken, naslagkaarten, eigen uitleg. Iedereen in de groep kan ze openen in de app, ' +
    'ook vaarders zonder instructeursrol. Toevoegen en weghalen is voor instructeurs.'));

  // Dit staat hier omdat dit het moment is waarop het ertoe doet: met het
  // bestand al in je hand, vlak voor je op uploaden drukt.
  view.append(el('div', { class: 'card' },
    el('p', {},
      el('b', {}, 'Is het materiaal van iemand anders? Vraag het eerst. '),
      el('span', { class: 'dim' },
        'Wat je hier neerzet komt in een app die in de stores staat. Voor een lesboek van ' +
        'een andere groep of een uitgever heb je toestemming nodig — die geldt dan voor ' +
        'jouw groep, want elke groep heeft zijn eigen map en ziet die van een ander niet.'))));

  const [rijen, diplomas] = await Promise.all([
    run(async () => check(await db.from('materials').select('*')
      .eq('group_id', group.id).order('created_at'))),
    run(async () => check(await db.from('diplomas').select('id, name, group_id')
      .order('sort_order'))),
  ]);

  view.append(uploadBlok(diplomas));

  const naam = new Map(diplomas.map((d) => [d.id, d.name]));
  const perDiploma = new Map();
  for (const r of rijen) {
    const sleutel = r.diploma_id ?? '';
    if (!perDiploma.has(sleutel)) perDiploma.set(sleutel, []);
    perDiploma.get(sleutel).push(r);
  }

  const doos = el('div', { class: 'card' });
  doos.append(el('h3', {}, 'Wat erin staat'));
  if (rijen.length === 0) {
    doos.append(el('p', { class: 'dim' }, 'Nog niets. Hierboven zet je het eerste bestand erin.'));
  }
  for (const [dipId, lijst] of perDiploma) {
    doos.append(el('div', { class: 'kop', style: 'margin-top:14px' },
      el('b', {}, dipId ? (naam.get(dipId) ?? 'Onbekend diploma') : 'Algemeen'),
      el('span', { class: 'teller' }, String(lijst.length))));
    for (const r of lijst) doos.append(materiaalRij(r));
  }
  view.append(doos);
}

function uploadBlok(diplomas) {
  const doos = el('div', { class: 'card' });
  doos.append(el('h3', {}, 'Toevoegen'));

  const titel = field('Titel', '', {});
  titel.input.placeholder = 'Lesboek Kielboot I';

  const kiezer = el('div', { class: 'row', style: 'flex-wrap:wrap; margin-top:10px' },
    el('span', { class: 'dim', style: 'margin-right:4px' }, 'Hoort bij:'));
  const teken = () => {
    [...kiezer.querySelectorAll('.chip')].forEach((c) => c.remove());
    kiezer.append(chip('Algemeen', lesDiploma === null, () => { lesDiploma = null; teken(); }));
    for (const d of diplomas) {
      kiezer.append(chip(d.name, lesDiploma === d.id, () => { lesDiploma = d.id; teken(); }));
    }
  };
  teken();

  const bestandKiezer = el('input', {
    type: 'file', accept: '.pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg',
  });

  const knop = el('button', {
    class: 'btn',
    onclick: async () => {
      const bestand = bestandKiezer.files?.[0];
      if (!bestand) { say('Kies eerst een bestand.', 'err'); return; }
      const naam = titel.input.value.trim() || bestand.name.replace(/\.[^.]+$/, '');
      if (naam.length < 2) { say('Geef het een titel.', 'err'); return; }

      knop.disabled = true;
      try {
        // De groep staat vooraan in het pad: de opslagregels kennen de tabel
        // materials niet en kijken alleen hiernaar.
        const ext = (bestand.name.split('.').pop() ?? 'pdf').toLowerCase();
        const pad = `${group.id}/${crypto.randomUUID()}.${ext}`;
        await run(async () => {
          const op = await db.storage.from('lesmateriaal').upload(pad, bestand, {
            contentType: bestand.type || 'application/pdf',
          });
          if (op.error) throw op.error;
          // Pas een regel maken als het bestand er echt staat. Andersom houd je
          // een regel over die naar niets wijst.
          check(await db.from('materials').insert({
            group_id: group.id, diploma_id: lesDiploma,
            title: naam, path: pad, bytes: bestand.size,
          }));
        }, `${naam} staat erin`);
        render();
      } finally {
        knop.disabled = false;
      }
    },
  }, 'Uploaden');

  doos.append(el('div', { class: 'row' }, titel.wrap));
  doos.append(kiezer);
  doos.append(el('div', { class: 'row', style: 'margin-top:10px' }, bestandKiezer, knop));
  doos.append(el('p', { class: 'dim', style: 'margin-top:8px' },
    'PDF, PNG of JPEG, tot 25 MB.'));
  return doos;
}

function materiaalRij(r) {
  const rij = el('div', { class: 'eisrij' });
  const bij = [bytesKort(r.bytes), datumKort(r.created_at)].filter(Boolean).join(' · ');

  rij.append(el('div', { class: 'kop' },
    el('span', {}, r.title, bij ? el('span', { class: 'dim' }, ' ' + bij) : null),
    el('span', { class: 'row', style: 'gap:6px' },
      el('button', {
        class: 'btn ghost',
        onclick: async () => {
          // Een ondertekende link, een uur geldig. De map is afgeschermd, dus
          // zonder dit kom je er niet in -- ook niet als je het pad kent.
          await run(async () => {
            const op = await db.storage.from('lesmateriaal').createSignedUrl(r.path, 3600);
            if (op.error) throw op.error;
            window.open(op.data.signedUrl, '_blank', 'noopener');
          });
        },
      }, 'Openen'),
      el('button', {
        class: 'btn danger',
        onclick: async () => {
          if (!confirmed(`"${r.title}" weghalen? Het bestand gaat ook weg.`)) return;
          await run(async () => {
            const op = await db.storage.from('lesmateriaal').remove([r.path]);
            if (op.error) throw op.error;
            check(await db.from('materials').delete().eq('id', r.id));
          }, 'Weggehaald');
          render();
        },
      }, 'Weghalen'))));
  return rij;
}

// ---- Voortgang
//
// Twee vragen die niet hetzelfde zijn. "Hoe ver is iedereen" is een lijst per
// lid — daar zoek je iemand in op. "Wat gaan we vanmiddag doen" is het overzicht
// per eis, met de eis die de meeste mensen nog missen bovenaan. Dat tweede is
// waar je naar kijkt als je op de steiger staat, en daarom staat het eronder in
// plaats van in een eigen tabblad.
//
// De app heeft hier niets aan: daar kijkt iemand naar zijn eigen vorderingen.
// Dit is het beeld dat een instructeur nodig heeft en een lid niet mag zien.
// group_progress en diploma_eis_stand weigeren dan ook iedereen die geen
// instructeur of beheerder is — met een foutmelding, niet met een lege lijst,
// want een lege lijst lijkt op een groep waar niets gebeurt.

let voortgangDiploma = null;   // het diploma in het onderste blok

function datumKort(d) {
  if (!d) return null;
  return new Date(d).toLocaleDateString('nl-NL', {
    day: 'numeric', month: 'short', year: 'numeric',
  });
}

let voortgangSpeltak = null;   // null = alle speltakken

async function renderVoortgang(view) {
  view.append(el('h2', {}, 'Voortgang'));
  view.append(el('p', { class: 'dim' },
    'Per diploma waar aan gewerkt wordt, de verste bovenaan. Blauw is gehaald, ' +
    'oranje is behandeld maar nog niet gehaald — alleen gehaald telt mee.'));

  const [stand, leden] = await Promise.all([
    run(async () => check(await db.rpc('group_progress', { p_group: group.id }))),
    run(async () => check(await db.rpc('group_members', { p_group: group.id }))),
  ]);

  // group_progress kent geen speltakken; group_members wel. Koppelen op
  // profile_id in plaats van er een kolom bij te vragen in de database.
  const speltakVan = new Map(leden.map((l) => [l.profile_id, (l.sections ?? [])[0] ?? null]));
  const alleSpeltakken = [...new Set(leden.flatMap((l) => l.sections ?? []))].sort();

  if (alleSpeltakken.length > 1) {
    const balk = el('div', { class: 'row', style: 'flex-wrap:wrap; margin-bottom:14px' },
      el('span', { class: 'dim', style: 'margin-right:4px' }, 'Speltak:'));
    balk.append(chip('Alle', voortgangSpeltak === null, () => {
      voortgangSpeltak = null; render();
    }));
    for (const s of alleSpeltakken) {
      balk.append(chip(s, voortgangSpeltak === s, () => { voortgangSpeltak = s; render(); }));
    }
    view.append(balk);
  }

  const inFilter = (pid) => {
    if (voortgangSpeltak === null) return true;
    const lid = leden.find((l) => l.profile_id === pid);
    return (lid?.sections ?? []).includes(voortgangSpeltak);
  };

  const zichtbaar = stand.filter((r) => inFilter(r.profile_id));

  view.append(...bezigBlokken(zichtbaar, speltakVan));
  view.append(klaarBlok(zichtbaar, speltakVan));
  view.append(zonderOpleidingBlok(stand, leden, inFilter));
  view.append(await perEisBlok(stand));
}

/** Gehaald + nog te gaan in één regel, zoals group_progress het teruggeeft. */
function standVan(r) {
  const gehaald = Number(r.praktijk_done) + Number(r.theorie_done);
  const totaal = Number(r.praktijk_total) + Number(r.theorie_total);
  return { gehaald, totaal, onderweg: Number(r.onderweg), open: totaal - gehaald };
}

/**
 * Eén kaart per diploma waar iemand mee bezig is.
 *
 * Jullie doen één diploma tegelijk en gaan pas door als het vol is, dus dit zijn
 * er normaal één of twee. Een kolom per diploma zou betekenen dat bijna elke cel
 * leeg is; zo staat er alleen wat er werkelijk loopt.
 */
function bezigBlokken(stand, speltakVan) {
  const bezig = stand.filter((r) => {
    const s = standVan(r);
    return s.totaal > 0 && s.open > 0;
  });

  const perDiploma = new Map();
  for (const r of bezig) {
    if (!perDiploma.has(r.diploma_id)) {
      perDiploma.set(r.diploma_id, { naam: r.diploma_name, rijen: [] });
    }
    perDiploma.get(r.diploma_id).rijen.push(r);
  }

  if (perDiploma.size === 0) return [];

  // Het drukste diploma bovenaan: daar werkt de groep aan.
  const groepen = [...perDiploma.values()].sort((a, b) => b.rijen.length - a.rijen.length);

  return groepen.map((g) => {
    // De verste bovenaan, zodat "wie kan bijna examen doen" meteen in beeld staat.
    g.rijen.sort((a, b) => {
      const sa = standVan(a), sb = standVan(b);
      return sb.gehaald / sb.totaal - sa.gehaald / sa.totaal
        || a.full_name.localeCompare(b.full_name, 'nl');
    });
    const totaal = standVan(g.rijen[0]).totaal;

    const doos = el('div', { class: 'card' });
    doos.append(el('div', { class: 'groepkop' },
      el('b', {}, g.naam),
      el('span', { class: 'dim' },
        g.rijen.length + (g.rijen.length === 1 ? ' vaarder' : ' vaarders') +
        ' · ' + totaal + ' eisen')));

    const tabel = el('table', { class: 'vt' });
    tabel.append(el('thead', {}, el('tr', {},
      el('th', {}, 'Naam'),
      el('th', {}, 'Voortgang'),
      el('th', { class: 'num' }, 'Te gaan'),
      el('th', { class: 'num' }, 'Laatst'))));
    const body = el('tbody', {});
    for (const r of g.rijen) body.append(voortgangRij(r, speltakVan.get(r.profile_id)));
    tabel.append(body);
    doos.append(tabel);
    return doos;
  });
}

function voortgangRij(r, speltak) {
  const s = standVan(r);
  const deel = (n) => (s.totaal > 0 ? (n / s.totaal) * 100 : 0);

  const rij = el('tr', { class: 'klikbaar' },
    el('td', { class: 'naamcel' }, r.full_name,
      speltak ? el('span', { class: 'speltak' }, speltak) : null),
    el('td', { class: 'balkcel' },
      el('div', { class: 'celbalk' },
        el('i', { style: 'width:' + deel(s.gehaald).toFixed(1) + '%' }),
        el('i', { class: 'onderweg', style: 'width:' + deel(s.onderweg).toFixed(1) + '%' })),
      el('span', { class: 'celcijfer' },
        s.gehaald + ' van ' + s.totaal + ' gehaald' +
        (s.onderweg ? ' · ' + s.onderweg + ' bezig' : ''))),
    el('td', { class: 'num' }, el('span', { class: 'teller' }, String(s.open))),
    el('td', { class: 'num dim' }, datumKort(r.laatst_afgetekend) ?? '–'));

  // De uitsplitsing die vroeger in de klapper stond. Eén regel tegelijk open,
  // zodat de tabel plat blijft.
  const detail = el('tr', { class: 'detailrij hidden' },
    el('td', { colspan: 4 },
      el('span', { class: 'dim' }, [
        'praktijk ' + r.praktijk_done + '/' + r.praktijk_total,
        'theorie ' + r.theorie_done + '/' + r.theorie_total,
        r.theory_passed_on ? 'theorie-examen ' + datumKort(r.theory_passed_on) : null,
        r.started_on ? 'begonnen ' + datumKort(r.started_on) : null,
        r.awarded_on ? 'uitgereikt ' + datumKort(r.awarded_on) : null,
      ].filter(Boolean).join(' · '))));
  rij.addEventListener('click', () => {
    const open = !detail.classList.contains('hidden');
    rij.parentElement.querySelectorAll('.detailrij').forEach((d) => d.classList.add('hidden'));
    detail.classList.toggle('hidden', open);
  });

  const fragment = document.createDocumentFragment();
  fragment.append(rij, detail);
  return fragment;
}

/**
 * Wie zijn diploma vol heeft en nergens anders meer voor staat.
 *
 * Dit is het gat dat ontstaat juist omdát jullie één diploma tegelijk doen: zo
 * iemand is nergens meer mee bezig, verdwijnt daardoor uit de blokken hierboven,
 * en staat stil tot iemand hem opmerkt.
 */
function klaarBlok(stand, speltakVan) {
  const perLid = new Map();
  for (const r of stand) {
    if (!perLid.has(r.profile_id)) perLid.set(r.profile_id, []);
    perLid.get(r.profile_id).push(r);
  }

  const klaar = [];
  for (const [pid, regels] of perLid) {
    const metEisen = regels.filter((r) => standVan(r).totaal > 0);
    if (metEisen.length === 0) continue;
    if (metEisen.some((r) => standVan(r).open > 0)) continue;   // nog bezig
    klaar.push({
      naam: regels[0].full_name,
      speltak: speltakVan.get(pid),
      diplomas: metEisen.map((r) => r.diploma_name),
      laatst: metEisen.map((r) => r.laatst_afgetekend).filter(Boolean).sort().pop() ?? null,
    });
  }
  if (klaar.length === 0) return null;
  klaar.sort((a, b) => (a.laatst ?? '').localeCompare(b.laatst ?? ''));

  const doos = el('div', { class: 'card' });
  doos.append(el('div', { class: 'groepkop' },
    el('b', {}, 'Klaar, nog geen volgende'),
    el('span', { class: 'teller let-op' }, String(klaar.length))));
  doos.append(el('p', { class: 'dim', style: 'margin-top:0' },
    'Deze vaarders hebben hun diploma vol en staan nergens meer voor ingeschreven. ' +
    'Zet de volgende klaar in de app, bij de vaarder zelf.'));

  const tabel = el('table', { class: 'vt' });
  const body = el('tbody', {});
  for (const k of klaar) {
    body.append(el('tr', {},
      el('td', { class: 'naamcel' }, k.naam,
        k.speltak ? el('span', { class: 'speltak' }, k.speltak) : null),
      el('td', {}, el('span', { class: 'celcijfer klaar' },
        '✓ ' + k.diplomas.join(' en ') + ' gehaald')),
      el('td', { class: 'num dim' }, datumKort(k.laatst) ?? '–')));
  }
  tabel.append(body);
  doos.append(tabel);
  return doos;
}

function zonderOpleidingBlok(stand, leden, inFilter) {
  const metInschrijving = new Set(stand.map((r) => r.profile_id));
  const zonder = leden.filter(
    (l) => !metInschrijving.has(l.profile_id) && inFilter(l.profile_id)
      && Number(l.in_progress) === 0 && Number(l.awarded) === 0,
  );
  if (zonder.length === 0) return null;

  const doos = el('div', { class: 'card' });
  doos.append(el('div', { class: 'groepkop' },
    el('b', {}, 'Nog geen opleiding'),
    el('span', { class: 'teller' }, String(zonder.length))));
  doos.append(el('div', { style: 'margin-top:4px' },
    ...zonder.map((l) => el('span', { class: 'naam' }, l.full_name))));
  return doos;
}

async function perEisBlok(stand) {
  const doos = el('div', { class: 'card' });
  doos.append(el('h3', {}, 'Wie moet wat nog doen'));

  // Alleen diploma's waar iemand voor staat ingeschreven. De hele catalogus
  // aanbieden geeft vijftien knoppen waarvan er twee ergens over gaan.
  const dips = [];
  const gezien = new Set();
  for (const r of stand) {
    if (gezien.has(r.diploma_id)) continue;
    gezien.add(r.diploma_id);
    dips.push({ id: r.diploma_id, naam: r.diploma_name });
  }

  if (dips.length === 0) {
    doos.append(el('p', { class: 'dim' },
      'Zodra er iemand voor een diploma staat ingeschreven, staat het hier.'));
    return doos;
  }
  if (!dips.some((d) => d.id === voortgangDiploma)) voortgangDiploma = dips[0].id;

  doos.append(el('p', { class: 'dim' },
    'Per eis, met de eis die de meeste mensen nog missen bovenaan — daar levert ' +
    'een middag op het water het meeste op. De namen zijn wie hem nog niet gehaald ' +
    'heeft; oranje is wie er al mee bezig is.'));

  const kiezer = el('div', { class: 'row', style: 'flex-wrap:wrap' });
  for (const d of dips) {
    kiezer.append(chip(d.naam, d.id === voortgangDiploma, () => {
      voortgangDiploma = d.id;
      render();
    }));
  }
  doos.append(kiezer);

  const rijen = await run(async () => check(await db.rpc('diploma_eis_stand', {
    p_group: group.id, p_diploma: voortgangDiploma,
  })));

  const perEis = new Map();
  for (const r of rijen) {
    if (!perEis.has(r.requirement_id)) {
      perEis.set(r.requirement_id, {
        kind: r.kind, positie: r.positie, title: r.title, leden: [],
      });
    }
    perEis.get(r.requirement_id).leden.push(r);
  }

  const lijst = [...perEis.values()].map((e) => ({
    ...e,
    klaar: e.leden.filter((l) => l.status === 'gehaald'),
    open: e.leden.filter((l) => l.status !== 'gehaald'),
  }));

  // De grootste gaten bovenaan. Bij een gelijke stand de volgorde uit het
  // handboek, zodat twee eisen niet elke keer van plek wisselen.
  lijst.sort((a, b) => b.open.length - a.open.length
    || a.kind.localeCompare(b.kind)
    || a.positie - b.positie);

  for (const e of lijst) {
    const rij = el('div', { class: 'eisrij' });
    rij.append(el('div', { class: 'kop' },
      el('span', {},
        el('span', { class: 'dim' },
          (e.kind === 'theorie' ? 'T' : 'P') + e.positie + ' '),
        e.title),
      el('span', { class: 'teller' + (e.open.length === 0 ? ' klaar' : '') },
        e.open.length === 0 ? 'iedereen' : e.klaar.length + '/' + e.leden.length)));

    if (e.open.length > 0) {
      const namen = el('div', {});
      const gesorteerd = [...e.open].sort(
        (a, b) => a.full_name.localeCompare(b.full_name, 'nl'));
      for (const l of gesorteerd) {
        namen.append(el('span', {
          class: 'naam' + (l.status === 'behandeld' ? ' onderweg' : ''),
        }, l.full_name));
      }
      rij.append(namen);
    }
    doos.append(rij);
  }
  return doos;
}

async function renderCodes(view) {
  view.append(el('h2', {}, 'Uitnodigingscodes'));

  const sections = await sectionsOf(group);

  const role = el('select', {}, el('option', { value: 'lid' }, 'Lid'),
    el('option', { value: 'instructeur' }, 'Instructeur'));
  const label = field('Waarvoor (optioneel)', '', {});
  const uses = el('select', {}, el('option', { value: '1' }, 'Eén keer te gebruiken'),
    el('option', { value: '50' }, 'Voor een hele groep'));

  // Een code met een speltak zet nieuwe leden er meteen in, zodra ze hem
  // invullen. Dat scheelt nalopen wie waar hoort.
  const speltak = el('select', {}, el('option', { value: '' }, 'Geen speltak'));
  for (const s of sections) speltak.append(el('option', { value: s.id }, s.name));

  view.append(el('div', { class: 'card' },
    el('div', { class: 'row' },
      el('div', { class: 'grow' }, el('label', {}, 'Wordt'), role),
      sections.length
        ? el('div', { class: 'grow' }, el('label', {}, 'Komt in speltak'), speltak)
        : null,
      label.wrap,
      el('div', { class: 'grow' }, el('label', {}, 'Geldigheid'), uses),
      el('button', {
        class: 'btn',
        onclick: async () => {
          await run(async () => {
            const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) code += alphabet[Math.floor(Math.random() * alphabet.length)];
            check(await db.from('invites').insert({
              group_id: group.id, code, role: role.value,
              label: label.input.value.trim() || null, max_uses: Number(uses.value),
              section_id: speltak.value || null,
            }));
          }, 'Code gemaakt');
          render();
        },
      }, 'Code maken'),
    )));

  const invites = check(await db.from('invites').select('*').eq('group_id', group.id)
    .order('created_at', { ascending: false }));

  if (!invites.length) view.append(el('p', { class: 'dim' }, 'Nog geen codes.'));

  for (const inv of invites) {
    view.append(el('div', { class: 'card row spread' },
      el('div', {},
        el('strong', { style: 'letter-spacing:3px; font-size:18px' }, inv.code),
        el('div', { class: 'dim' },
          `${inv.role}` +
          (inv.section_id ? ` · ${sections.find((s) => s.id === inv.section_id)?.name ?? 'speltak'}` : '') +
          `${inv.label ? ` · ${inv.label}` : ''} · ${inv.uses} van ${inv.max_uses} gebruikt`)),
      el('button', {
        class: 'btn danger',
        onclick: async () => {
          await run(async () => check(await db.from('invites').delete().eq('id', inv.id)), 'Ingetrokken');
          render();
        },
      }, 'Intrekken'),
    ));
  }
}

/**
 * Wie er samen in een boot zit. In de app kies je onder "Op het water" een bak
 * en zie je iedereen erin; hier deel je ze in, met een groter scherm en een
 * toetsenbord.
 *
 * De bemanning komt uit crew_members, die op lidmaatschap hangt, en
 * group_members geeft bij elke persoon zijn lidmaatschap mee. Zo zijn alle
 * bakken met één keer ophalen te tellen, in plaats van één verzoek per bak.
 */
async function renderBakken(view) {
  view.append(el('h2', {}, 'Bakken'));
  view.append(el('p', { class: 'dim' },
    'Een vaste bemanning voor het seizoen. In de app kies je onder "Op het water" een bak, een diploma en een eis, en zie je iedereen in die boot.'));

  const nieuw = field('Nieuwe bak', '', {});
  nieuw.input.placeholder = 'Vlet 1, Albatros, …';
  view.append(el('div', { class: 'card row' }, nieuw.wrap,
    el('button', {
      class: 'btn',
      onclick: async () => {
        if (nieuw.input.value.trim().length < 2) return;
        await run(async () => check(await db.from('crews').insert({
          group_id: group.id, name: nieuw.input.value.trim(),
        })), 'Bak toegevoegd');
        render();
      },
    }, 'Toevoegen')));

  const [crews, members, links] = await Promise.all([
    run(async () => check(await db.from('crews').select('*')
      .eq('group_id', group.id).order('sort_order').order('name'))),
    run(async () => check(await db.rpc('group_members', { p_group: group.id }))),
    run(async () => check(await db.from('crew_members').select('crew_id, membership_id'))),
  ]);

  if (!crews.length) {
    view.append(el('p', { class: 'dim' }, 'Nog geen bakken.'));
    return;
  }

  const profileOf = new Map(members.map((m) => [m.membership_id, m.profile_id]));
  for (const c of crews) {
    const aboard = new Set(
      links.filter((l) => l.crew_id === c.id).map((l) => profileOf.get(l.membership_id)),
    );
    view.append(crewCard(c, members, aboard));
  }
}

function crewCard(crew, members, aboard) {
  const card = el('div', { class: 'card' });
  const count = el('span', { class: 'dim' });
  const chosen = new Set(aboard);

  const paintCount = () => {
    count.textContent = `${chosen.size} ${chosen.size === 1 ? 'opvarende' : 'opvarenden'}`;
  };
  paintCount();

  const naam = el('input', { value: crew.name });

  card.append(el('div', { class: 'row spread' },
    el('div', { class: 'row grow' }, naam,
      el('button', {
        class: 'btn ghost',
        onclick: async () => {
          if (naam.value.trim().length < 2) return;
          await run(async () => check(await db.from('crews')
            .update({ name: naam.value.trim() }).eq('id', crew.id)), 'Naam opgeslagen');
        },
      }, 'Naam opslaan')),
    count));

  // Aanvinken en dan opslaan: een bemanning samenstellen is een handvol keuzes
  // die bij elkaar horen, en set_crew_members vervangt de hele set in één keer.
  const list = el('details', {}, el('summary', {}, 'Indelen'));
  const boxes = el('div', { style: 'margin-top:10px; columns: 2 220px; column-gap: 24px' });
  for (const m of members) {
    const box = el('input', { type: 'checkbox', style: 'width:auto; margin:0' });
    box.checked = chosen.has(m.profile_id);
    box.addEventListener('change', () => {
      if (box.checked) chosen.add(m.profile_id);
      else chosen.delete(m.profile_id);
      paintCount();
    });
    boxes.append(el('label', {
      style: 'display:flex; gap:8px; align-items:center; font-size:14px; font-weight:400; color:var(--text); margin:0 0 8px; break-inside:avoid; cursor:pointer',
    }, box, m.full_name || 'Naam nog niet ingevuld',
      m.sections?.length ? el('span', { class: 'dim' }, `· ${m.sections.join(', ')}`) : null));
  }
  list.append(boxes);
  list.append(el('div', { class: 'row', style: 'margin-top:12px' },
    el('button', {
      class: 'btn',
      onclick: async () => {
        await run(async () => check(await db.rpc('set_crew_members', {
          p_crew: crew.id, p_profiles: [...chosen],
        })), 'Indeling opgeslagen');
      },
    }, 'Indeling opslaan'),
    el('button', {
      class: 'btn danger',
      onclick: async () => {
        if (!confirmed(`${crew.name} verwijderen?\n\nDe vaarders en hun aftekeningen blijven bestaan; alleen de indeling verdwijnt.`)) return;
        await run(async () => check(await db.from('crews').delete().eq('id', crew.id)), 'Bak verwijderd');
        render();
      },
    }, 'Bak verwijderen')));

  card.append(list);
  return card;
}

// ---- Catalogus
//
// Twee soorten lijsten, en dat verschil is waar dit scherm om draait.
//
//   landelijk   (group_id is null) van niemand. Te lezen en te kopiëren, niet
//               te wijzigen: dat zou elke groep in deze database raken, en
//               supabase/010-eisen.sql overschrijft het toch weer.
//   eigen       van deze groep. Een insigne, of de verkorte eisen van een kamp.
//               Hier volledig in te richten; niemand buiten de groep ziet hem.

async function renderCatalogus(view) {
  view.append(el('h2', {}, "Diploma's en eisen"));

  const [disciplines, diplomas] = await Promise.all([
    check(await db.from('disciplines').select('*').order('sort_order')),
    check(await db.from('diplomas').select('*').order('sort_order')),
  ]);
  const eigen = diplomas.filter((d) => d.group_id);
  const landelijk = diplomas.filter((d) => !d.group_id);

  // ---- eigen lijsten
  view.append(el('h3', {}, 'Eigen lijsten'));
  view.append(el('div', { class: 'note' },
    'Lijsten van onze groep, naast de landelijke eisen. Ze tellen en tekenen af als elk ander diploma, ' +
    'maar alleen wij zien ze en het opnieuw laden van de landelijke eisen raakt ze niet.'));

  const eigenDoos = el('div', { class: 'card' });
  if (eigen.length === 0) {
    eigenDoos.append(el('p', { class: 'dim' }, 'Nog geen eigen lijst.'));
  }
  for (const dip of eigen) eigenDoos.append(eigenLijstBlock(dip));

  const nieuweNaam = field('Naam', '', {});
  const soort = el('select', {},
    el('option', { value: 'diploma' }, 'Diploma'),
    el('option', { value: 'insigne' }, 'Insigne'));
  eigenDoos.append(el('details', {}, el('summary', {}, 'Lege lijst beginnen'),
    el('div', { class: 'row', style: 'margin-top:10px' }, nieuweNaam.wrap, soort,
      el('button', {
        class: 'btn',
        onclick: async () => {
          const naam = nieuweNaam.input.value.trim();
          if (naam.length < 2) return;
          await run(async () => check(await db.rpc('create_own_list', {
            p_group: group.id, p_name: naam, p_kind: soort.value, p_summary: null,
          })), 'Lijst gemaakt');
          render();
        },
      }, 'Maken'))));
  view.append(eigenDoos);

  // ---- landelijk
  view.append(el('h3', {}, 'Landelijk'));
  view.append(el('div', { class: 'note' },
    'Vastgesteld door de Watersport Academy en voor iedere groep gelijk, dus hier alleen te lezen. ' +
    'Wil je een kortere versie voor een kamp, maak er dan een eigen kopie van — schrappen in die kopie ' +
    'laat het origineel heel. Moet de landelijke lijst zelf kloppen, pas dan supabase/010-eisen.sql aan.'));

  for (const d of disciplines) {
    const box = el('div', { class: 'card' });
    box.append(el('h4', {}, d.name + (d.subtitle ? ` — ${d.subtitle}` : '')));
    for (const dip of landelijk.filter((x) => x.discipline_id === d.id)) {
      box.append(landelijkBlock(dip));
    }
    view.append(box);
  }
}

/** Een landelijke lijst: lezen, en desgewenst kopiëren. */
function landelijkBlock(dip) {
  const details = klapper(`diploma:${dip.id}`,
    `${dip.name}${dip.level_label ? ` (${dip.level_label})` : ''}`);
  const body = el('div', { style: 'margin-top:12px' }, el('p', { class: 'dim' }, 'Bezig met laden…'));
  details.append(body);

  details.addEventListener('toggle', async () => {
    if (!details.open || details.dataset.loaded) return;
    details.dataset.loaded = '1';
    body.innerHTML = '';

    const naam = field('Naam voor de kopie', `${dip.name} (kort)`, {});
    body.append(el('div', { class: 'row' }, naam.wrap,
      el('button', {
        class: 'btn',
        onclick: async () => {
          await run(async () => check(await db.rpc('copy_list_to_group', {
            p_group: group.id, p_source: dip.id,
            p_name: naam.input.value.trim() || null, p_kind: 'diploma',
          })), 'Gekopieerd naar je eigen lijsten');
          render();
        },
      }, 'Kopiëren naar eigen lijst')));

    const eisen = check(await db.from('requirements').select('*')
      .eq('diploma_id', dip.id).order('kind').order('position'));

    for (const kind of ['praktijk', 'theorie']) {
      const top = eisen.filter((r) => r.kind === kind && !r.parent_id);
      if (top.length === 0) continue;
      body.append(el('h4', {}, kind === 'praktijk' ? 'Praktijk' : 'Theorie'));
      const lijst = el('ol', { class: 'dim', style: 'margin:0 0 10px 18px' });
      for (const eis of top) {
        const parts = eisen.filter((r) => r.parent_id === eis.id);
        lijst.append(el('li', {}, eis.title + (parts.length ? ` — ${parts.length} onderdelen` : '')));
      }
      body.append(lijst);
    }
  });

  return details;
}

/** Een eigen lijst: alles mag. */
function eigenLijstBlock(dip) {
  const details = klapper(`diploma:${dip.id}`,
    `${dip.name}${dip.kind === 'insigne' ? ' — insigne' : ''}`);
  const body = el('div', { style: 'margin-top:12px' }, el('p', { class: 'dim' }, 'Bezig met laden…'));
  details.append(body);

  details.addEventListener('toggle', async () => {
    if (!details.open || details.dataset.loaded) return;
    details.dataset.loaded = '1';
    body.innerHTML = '';

    const naam = field('Naam', dip.name, {});
    const soort = el('select', {},
      el('option', { value: 'diploma', selected: dip.kind === 'diploma' }, 'Diploma'),
      el('option', { value: 'insigne', selected: dip.kind === 'insigne' }, 'Insigne'));
    const samenvatting = field('Omschrijving', dip.summary ?? '', { multiline: true, wrapClass: 'grow' });

    body.append(el('div', { class: 'row' }, naam.wrap, soort));
    body.append(el('div', { class: 'row', style: 'margin-top:10px' }, samenvatting.wrap));
    body.append(el('div', { class: 'row', style: 'margin-top:10px' },
      el('button', {
        class: 'btn ghost',
        onclick: () => run(async () => check(await db.rpc('update_own_list', {
          p_diploma: dip.id, p_name: naam.input.value.trim(),
          p_kind: soort.value, p_summary: samenvatting.input.value || null,
        })), 'Opgeslagen'),
      }, 'Opslaan'),
      el('button', {
        class: 'btn danger',
        onclick: async () => {
          if (!confirmed(`${dip.name} verwijderen?\n\nAlle eisen en onderdelen gaan mee. Werkt er nog iemand aan deze lijst, dan weigert de database het.`)) return;
          await run(async () => check(await db.rpc('delete_own_list', { p_diploma: dip.id })), 'Verwijderd');
          render();
        },
      }, 'Lijst verwijderen')));

    const eisen = check(await db.from('requirements').select('*')
      .eq('diploma_id', dip.id).order('kind').order('position'));

    for (const kind of ['praktijk', 'theorie']) {
      body.append(el('h4', {}, kind === 'praktijk' ? 'Praktijk' : 'Theorie'));
      const top = eisen.filter((r) => r.kind === kind && !r.parent_id);
      for (const eis of top) {
        body.append(eigenEisBlock(eis, eisen.filter((r) => r.parent_id === eis.id), top));
      }
      body.append(nieuweEis(dip.id, kind));

  return details;
}

function eigenEisBlock(eis, parts, buren) {
  const wrap = el('div', { class: 'card', style: 'background:var(--bg)' });
  const titel = field('Eis', eis.title, {});
  const toelichting = field('Toelichting', eis.detail ?? '', { multiline: true });

  // Volgorde gaat met op en neer, niet met een nummertje: de database wil de
  // hele rij in één keer, anders botst een wissel met zichzelf.
  const verplaats = (richting) => {
    const ids = buren.map((r) => r.id);
    const i = ids.indexOf(eis.id);
    const j = i + richting;
    if (j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    run(async () => {
      check(await db.rpc('set_own_requirement_order', {
        p_diploma: eis.diploma_id, p_kind: eis.kind, p_parent: null, p_ids: ids,
      }));
      render();
    }, 'Volgorde aangepast');
  };

  wrap.append(el('div', { class: 'row' },
    el('span', { class: 'dim' }, `${eis.position}.`), titel.wrap,
    el('button', { class: 'btn ghost', onclick: () => verplaats(-1) }, '↑'),
    el('button', { class: 'btn ghost', onclick: () => verplaats(1) }, '↓'),
    el('button', {
      class: 'btn ghost',
      onclick: () => run(async () => check(await db.rpc('update_own_requirement', {
        p_requirement: eis.id, p_title: titel.input.value.trim(),
        p_detail: toelichting.input.value || null,
      })), 'Opgeslagen'),
    }, 'Opslaan'),
    el('button', {
      class: 'btn danger',
      onclick: async () => {
        if (!confirmed(`Eis "${eis.title}" verwijderen?\n\nDe onderdelen én de aftekeningen die eraan hangen gaan mee.`)) return;
        await run(async () => check(await db.rpc('delete_own_requirement', { p_requirement: eis.id })), 'Verwijderd');
        render();
      },
    }, 'Verwijderen')));
  wrap.append(el('div', { class: 'row', style: 'margin-top:8px' }, toelichting.wrap));

  const onderdelen = el('details', {}, el('summary', {}, `${parts.length} onderdelen`));
  for (const p of parts) {
    const pt = el('input', { value: p.title });
    onderdelen.append(el('div', { class: 'part' },
      el('span', { class: 'dim' }, `${p.position}.`), pt,
      el('button', {
        class: 'btn ghost',
        onclick: () => run(async () => check(await db.rpc('update_own_requirement', {
          p_requirement: p.id, p_title: pt.value.trim(), p_detail: null,
        })), 'Opgeslagen'),
      }, 'Opslaan'),
      el('button', {
        class: 'btn danger',
        onclick: async () => {
          if (!confirmed(`Onderdeel "${p.title}" verwijderen?`)) return;
          await run(async () => check(await db.rpc('delete_own_requirement', { p_requirement: p.id })), 'Verwijderd');
          render();
        },
      }, '×')));
  }

  const nieuw = el('input', { placeholder: 'Nieuw onderdeel, bijvoorbeeld: Paalsteek' });
  onderdelen.append(el('div', { class: 'part' }, nieuw,
    el('button', {
      class: 'btn',
      onclick: async () => {
        if (!nieuw.value.trim()) return;
        await run(async () => check(await db.rpc('add_own_requirement', {
          p_diploma: eis.diploma_id, p_kind: eis.kind, p_title: nieuw.value.trim(),
          p_detail: null, p_parent: eis.id,
        })), 'Onderdeel toegevoegd');
        render();
      },
    }, 'Toevoegen')));

  wrap.append(onderdelen);
  return wrap;
}
