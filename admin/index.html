/**
 * Een examen inlezen uit een bestand.
 *
 * De inlezer (scripts/examen-import.mjs) maakt van een CWO-examen-PDF een
 * bestand met de vragen, de vier antwoorden, welk antwoord goed is en de
 * plaatjes. Hier komt dat binnen: het examen wordt aangemaakt, de vragen
 * eronder, en de plaatjes gaan naar de opslagmap.
 *
 * Schrijven gebeurt met jouw account, want alleen een ingelogde instructeur
 * mag dat. Een script met een sleutel dat buiten de browser draait zou die
 * regel omzeilen, en dan staat die sleutel ergens in een bestand.
 */
/**
 * Examenantwoorden opruimen.
 *
 * Het privacybeleid zegt dat de gegeven antwoorden na afloop van het seizoen
 * weggaan en dat alleen de uitslag blijft. Dit is de knop die dat waarmaakt.
 *
 * Eerst tellen, dan pas wissen: je ziet hoeveel deelnames en antwoorden het
 * raakt voordat er iets verdwijnt. Wissen kan niet ongedaan gemaakt worden en
 * mag daarom alleen door een beheerder.
 */
function opruimBlok() {
  const doos = el('div', { class: 'card' });
  doos.append(el('h3', {}, 'Antwoorden opruimen'));
  doos.append(el('p', { class: 'dim' },
    'Van examens die vóór deze datum zijn afgenomen gaan de gegeven antwoorden weg. ' +
    'De uitslag blijft staan: naam, score en of het gehaald is. Dit kan niet ongedaan gemaakt worden.'));

  // Standaard 1 september van dit jaar: het begin van het seizoen, dus alles
  // van vorig seizoen valt eronder.
  const nu = new Date();
  const standaard = `${nu.getFullYear() - (nu.getMonth() < 8 ? 1 : 0)}-09-01`;

  const datum = field('Alles van vóór', standaard, {});
  datum.input.type = 'date';
  const stand = el('div', { class: 'dim', style: 'margin-top:8px' });

  const tellen = async () => {
    stand.textContent = 'Tellen…';
    const rijen = await run(async () => check(await db.rpc('exam_cleanup_preview', {
      p_group: group.id, p_voor: datum.input.value,
    })));
    const r = rijen?.[0];
    if (!r || Number(r.antwoorden) === 0) {
      stand.textContent = 'Er staat niets van vóór die datum.';
      return null;
    }
    stand.textContent =
      `${r.antwoorden} antwoorden van ${r.deelnames} deelnames, uit ${r.sessies} sessies.`;
    return r;
  };

  doos.append(el('div', { class: 'row' }, datum.wrap,
    el('button', { class: 'btn ghost', onclick: () => tellen() }, 'Tellen'),
    el('button', {
      class: 'btn danger',
      onclick: async () => {
        const r = await tellen();
        if (!r) return;
        if (!confirmed(
          `${r.antwoorden} antwoorden wissen?\n\n` +
          `Van ${r.deelnames} deelnames uit ${r.sessies} sessies, afgenomen vóór ${datum.input.value}. ` +
          'De uitslagen blijven staan. Dit kun je niet terugdraaien.',
        )) return;

        const weg = await run(async () => check(await db.rpc('exam_cleanup', {
          p_group: group.id, p_voor: datum.input.value,
        })), 'Opgeruimd');
        stand.textContent = `${weg} antwoorden gewist. De uitslagen staan er nog.`;
      },
    }, 'Wissen')));

  doos.append(stand);
  return doos;
}

function importBlok() {
  const doos = el('div', { class: 'card' });
  doos.append(el('h3', {}, 'Examen inlezen'));
  doos.append(el('p', { class: 'dim' },
    'Kies een bestand dat met scripts/examen-import.mjs uit een examen-PDF is gemaakt. ' +
    'Het examen, de vragen, de antwoorden en de plaatjes komen er in één keer in.'));

  const kiezer = el('input', { type: 'file', accept: '.json,application/json' });

  // Inlezen duurt even — 35 vragen, 19 plaatjes — dus laat zien hoever hij is.
  // De balk en de regel eronder blijven staan als hij klaar is; pas als jij op
  // "Vernieuwen" klikt wordt het scherm opnieuw getekend.
  const balk = el('div', { class: 'voortgang hidden' }, el('i', { style: 'width:0%' }));
  const stand = el('div', { class: 'dim', style: 'margin-top:8px' });
  const knop = el('button', { class: 'btn' }, 'Inlezen');

  const meld = async (tekst, deel) => {
    stand.textContent = tekst;
    if (typeof deel === 'number') {
      balk.classList.remove('hidden');
      balk.firstChild.style.width = `${Math.round(deel * 100)}%`;
    }
    // Eén tel wachten zodat de browser de nieuwe stand ook echt tekent voordat
    // het volgende verzoek de lijn bezet houdt.
    await new Promise((klaar) => requestAnimationFrame(() => setTimeout(klaar, 0)));
  };

  knop.addEventListener('click', async () => {
    const bestand = kiezer.files?.[0];
    if (!bestand) {
      stand.textContent = 'Kies eerst een bestand.';
      return;
    }

    let data;
    try {
      data = JSON.parse(await bestand.text());
    } catch {
      stand.textContent = 'Dat bestand is geen geldig importbestand.';
      return;
    }
    if (!data?.vragen?.length) {
      stand.textContent = 'Er staan geen vragen in dat bestand.';
      return;
    }

    knop.disabled = true;
    try {
      const klaar = await lezenIn(data, meld);
      await meld(`Klaar: ${klaar.vragen} vragen, ${klaar.plaatjes} plaatjes, ${klaar.eisen} aan een eis gekoppeld.`, 1);
      doos.append(el('div', { class: 'row', style: 'margin-top:10px' },
        el('button', { class: 'btn', onclick: () => render() }, 'Vernieuwen')));
    } catch (e) {
      await meld(`Het inlezen stopte: ${message(e)}`);
    } finally {
      knop.disabled = false;
    }
  });

  doos.append(el('div', { class: 'row' }, kiezer, knop));
  doos.append(balk, stand);
  return doos;
}

/**
 * Tekst die de database aanneemt.
 *
 * Postgres weigert een \u0000 in tekst, en terecht. Bij het uitpakken van een
 * PDF kan zo'n teken meeliften, en dan strandt een hele import op één antwoord.
 * Alles vanaf het eerste stuurteken gaat eraf.
 */
function schoneTekst(tekst) {
  const stuur = /[\u0000-\u0008\u000b\u000c\u000e-\u001f]/.exec(tekst ?? '');
  return (stuur ? String(tekst).slice(0, stuur.index) : String(tekst ?? '')).trim();
}

async function lezenIn(data, meld) {
  await meld(`${data.titel ?? 'Examen'} aanmaken…`, 0.05);

  const examen = check(await db.from('exams').insert({
    group_id: group.id,
    title: schoneTekst(data.titel) || 'Ingelezen examen',
    intro: data.intro ?? null,
    pass_percent: Math.max(0, Math.min(100, Number(data.grens) || 70)),
  }).select('id'));
  const examId = examen[0].id;

  // Vragen en antwoorden in één keer per soort: 35 losse verzoeken duren op een
  // trage verbinding in het clubhuis ongemakkelijk lang.
  // Het importbestand noemt per vraag de eis waar hij over gaat, met de code
  // die in de catalogus staat ("kielboot-2.t5"). Die codes hier omzetten naar
  // ids: dan weet een uitslag straks per eis hoe het ging.
  const eisCodes = [...new Set(data.vragen.map((v) => v.eis).filter(Boolean))];
  let eisVan = {};
  if (eisCodes.length) {
    await meld('Eisen opzoeken…', 0.1);
    const gevonden = check(await db.from('requirements').select('id, code').in('code', eisCodes));
    eisVan = Object.fromEntries(gevonden.map((r) => [r.code, r.id]));
  }

  await meld(`${data.vragen.length} vragen toevoegen…`, 0.15);
  const vragen = check(await db.from('exam_questions').insert(
    data.vragen.map((v, i) => ({
      exam_id: examId,
      position: v.nummer ?? i + 1,
      prompt: schoneTekst(v.vraag),
      kind: 'meerkeuze',
      points: 1,
      requirement_id: eisVan[v.eis] ?? null,
    })),
  ).select('id, position'));

  const opties = [];
  for (const v of data.vragen) {
    const vraag = vragen.find((q) => q.position === v.nummer);
    if (!vraag) continue;
    v.antwoorden.forEach((label, i) => {
      opties.push({
        question_id: vraag.id,
        position: i + 1,
        label: schoneTekst(label),
        // `goed` is de index uit het nakijkblad: 0 is a, 1 is b, enzovoort.
        correct: i === v.goed,
      });
    });
  }
  await meld(`${opties.length} antwoorden toevoegen…`, 0.3);
  check(await db.from('exam_options').insert(opties));

  // De plaatjes. Eén voor één, zodat je ziet hoever hij is en een mislukte
  // upload de rest niet meesleept.
  const metPlaatje = data.vragen.filter((v) => v.plaatje);
  let gedaan = 0;
  for (const v of metPlaatje) {
    const vraag = vragen.find((q) => q.position === v.nummer);
    if (!vraag) continue;
    gedaan++;
    await meld(`Plaatje ${gedaan} van ${metPlaatje.length} uploaden…`,
      0.4 + 0.6 * (gedaan / Math.max(1, metPlaatje.length)));

    const bytes = Uint8Array.from(atob(v.plaatje.base64), (c) => c.charCodeAt(0));
    const pad = `${examId}/${vraag.id}.png`;
    const op = await db.storage.from('examen').upload(pad, new Blob([bytes], { type: 'image/png' }), {
      upsert: true, contentType: 'image/png',
    });
    if (op.error) {
      await meld(`Plaatje bij vraag ${v.nummer} lukte niet: ${op.error.message}`);
      continue;
    }
    check(await db.from('exam_questions').update({ image_path: pad }).eq('id', vraag.id));
  }

  const metEis = data.vragen.filter((v) => eisVan[v.eis]).length;
  say(`${data.titel} staat erin: ${vragen.length} vragen, ${gedaan} plaatjes, ${metEis} aan een eis gekoppeld.`, 'ok');
  return { vragen: vragen.length, plaatjes: gedaan, eisen: metEis };
}

function examenBlock(ex, diplomas) {
  const details = klapper(`examen:${ex.id}`, ex.title);
  const body = el('div', { style: 'margin-top:12px' }, el('p', { class: 'dim' }, 'Bezig met laden…'));
  details.append(body);

  details.addEventListener('toggle', async () => {
    if (!details.open || details.dataset.loaded) return;
    details.dataset.loaded = '1';
    body.innerHTML = '';

    const titel = field('Titel', ex.title, {});
    const intro = field('Uitleg vooraf', ex.intro ?? '', { multiline: true, wrapClass: 'grow' });
    const grens = field('Geslaagd vanaf (%)', ex.pass_percent, { wrapClass: 'num' });
    grens.input.type = 'number';

    const diploma = el('select', {},
      el('option', { value: '' }, 'Geen diploma'),
      ...diplomas.map((d) => el('option',
        { value: d.id, selected: d.id === ex.diploma_id },
        d.name + (d.kind === 'insigne' ? ' (insigne)' : ''))));

    const schudden = el('input', { type: 'checkbox' });
    schudden.checked = ex.shuffle;

    body.append(el('div', { class: 'row' }, titel.wrap, grens.wrap, diploma));
    body.append(el('div', { class: 'row', style: 'margin-top:10px' }, intro.wrap));
    body.append(el('div', { class: 'row', style: 'margin-top:10px' },
      el('label', { class: 'dim' }, schudden, ' Volgorde per deelnemer schudden'),
      el('button', {
        class: 'btn ghost',
        onclick: () => run(async () => check(await db.from('exams').update({
          title: titel.input.value.trim(),
          intro: intro.input.value || null,
          pass_percent: Math.max(0, Math.min(100, Number(grens.input.value) || 0)),
          diploma_id: diploma.value || null,
          shuffle: schudden.checked,
        }).eq('id', ex.id)), 'Opgeslagen'),
      }, 'Opslaan'),
      el('button', {
        class: 'btn danger',
        onclick: async () => {
          if (!confirmed(`${ex.title} verwijderen?\n\nAlle vragen gaan mee, en ook de afgenomen sessies met de antwoorden die daarin staan.`)) return;
          await run(async () => check(await db.from('exams').delete().eq('id', ex.id)), 'Verwijderd');
          render();
        },
      }, 'Examen verwijderen')));

    const vragen = check(await db.from('exam_questions').select('*')
      .eq('exam_id', ex.id).order('position'));
    const opties = vragen.length
      ? check(await db.from('exam_options').select('*')
          .in('question_id', vragen.map((q) => q.id)).order('position'))
      : [];

    // Bij welke eis een vraag hoort, in één keer opgehaald: anders staat er bij
    // elke vraag alleen een id dat niemand kan lezen.
    const eisIds = [...new Set(vragen.map((q) => q.requirement_id).filter(Boolean))];
    const eisen = eisIds.length
      ? check(await db.from('requirements').select('id, position, title').in('id', eisIds))
      : [];
    const eisVan = Object.fromEntries(eisen.map((r) => [r.id, r]));

    body.append(el('h3', {}, `${vragen.length} vragen`));
    for (const vraag of vragen) {
      body.append(vraagBlock(vraag, opties.filter((o) => o.question_id === vraag.id), vragen,
        eisVan[vraag.requirement_id]));
    }
    body.append(nieuweVraag(ex.id, vragen));
    body.append(uitEisen(ex, vragen, diplomas));
    body.append(sessiesBlock(ex));
  });

  return details;
}

/**
 * Vragen maken uit de eisenlijst.
 *
 * Een theorie-examen gaat over de eisen die toch al in de app staan, dus klik je
 * ze hier aan in plaats van ze over te typen. De vraag houdt vast bij welke eis
 * hij hoort (021), zodat een uitslag later terug te vertalen is naar de
 * vorderingenstaat.
 *
 * Alles is een knop: het diploma, de soort eisen, de eisen zelf en wat voor
 * antwoorden eronder moeten. Wie een examen bouwt, tikt hooguit de losse
 * antwoorden in die alleen hij kan verzinnen.
 */
function uitEisen(ex, vragen, diplomas) {
  const doos = el('div', { class: 'card', style: 'margin-top:12px' });
  doos.append(el('h3', {}, 'Vragen uit de eisenlijst'));

  let diplomaId = ex.diploma_id ?? '';
  let soort = 'theorie';
  let vorm = 'juist_onjuist';
  const gekozen = new Set();

  const diplomaRij = el('div', { class: 'row', style: 'flex-wrap:wrap; gap:6px' });
  const soortRij = el('div', { class: 'row', style: 'flex-wrap:wrap; gap:6px; margin-top:8px' });
  const vormRij = el('div', { class: 'row', style: 'flex-wrap:wrap; gap:6px; margin-top:8px' });
  const lijst = el('div', { style: 'margin-top:10px' });
  const voet = el('div', { class: 'row', style: 'margin-top:10px' });

  doos.append(diplomaRij, soortRij, vormRij, lijst, voet);

  // Welke eisen al in dit examen zitten; die hoeven er niet nog een keer bij.
  const alGebruikt = new Set(vragen.map((q) => q.requirement_id).filter(Boolean));

  const tekenKoppen = () => {
    diplomaRij.innerHTML = '';
    diplomaRij.append(el('span', { class: 'dim' }, 'Diploma'));
    for (const d of diplomas) {
      diplomaRij.append(chip(d.name, d.id === diplomaId, () => {
        diplomaId = d.id;
        gekozen.clear();
        tekenKoppen();
        laden();
      }));
    }

    soortRij.innerHTML = '';
    soortRij.append(el('span', { class: 'dim' }, 'Soort'));
    for (const [waarde, naam] of [['theorie', 'Theorie'], ['praktijk', 'Praktijk']]) {
      soortRij.append(chip(naam, soort === waarde, () => {
        soort = waarde;
        gekozen.clear();
        tekenKoppen();
        laden();
      }));
    }

    vormRij.innerHTML = '';
    vormRij.append(el('span', { class: 'dim' }, 'Antwoorden'));
    for (const [waarde, naam] of [
      ['juist_onjuist', 'Juist / onjuist'],
      ['onderdelen', 'De onderdelen van de eis'],
      ['leeg', 'Zelf invullen'],
    ]) {
      vormRij.append(chip(naam, vorm === waarde, () => { vorm = waarde; tekenKoppen(); }));
    }
  };

  const tekenVoet = () => {
    voet.innerHTML = '';
    if (gekozen.size === 0) {
      voet.append(el('span', { class: 'dim' }, 'Klik de eisen aan die je wilt gebruiken.'));
      return;
    }
    voet.append(
      el('button', {
        class: 'btn',
        onclick: () => toevoegen(),
      }, `${gekozen.size} ${gekozen.size === 1 ? 'eis' : 'eisen'} toevoegen`),
      el('button', { class: 'btn ghost', onclick: () => { gekozen.clear(); laden(); } }, 'Niets'),
    );
  };

  let eisenNu = [];

  const laden = async () => {
    lijst.innerHTML = '';
    tekenVoet();
    if (!diplomaId) {
      lijst.append(el('p', { class: 'dim' }, 'Kies eerst een diploma.'));
      return;
    }

    // De eisen én hun onderdelen in één keer: de onderdelen zijn straks de
    // antwoorden, dus je wilt meteen zien hoeveel er zijn.
    const alles = check(await db.from('requirements')
      .select('id, position, title, kind, parent_id')
      .eq('diploma_id', diplomaId)
      .order('position'));

    eisenNu = alles.filter((r) => !r.parent_id && r.kind === soort);
    const onderdelenVan = (id) => alles.filter((r) => r.parent_id === id);

    lijst.innerHTML = '';
    if (eisenNu.length === 0) {
      lijst.append(el('p', { class: 'dim' }, 'Dit diploma heeft geen eisen van die soort.'));
      return;
    }

    for (const eis of eisenNu) {
      const staatErAl = alGebruikt.has(eis.id);
      const aantal = onderdelenVan(eis.id).length;
      const aan = gekozen.has(eis.id);

      const regel = el('button', {
        class: `keuzeregel${aan ? ' aan' : ''}${staatErAl ? ' uit' : ''}`,
        onclick: () => {
          if (staatErAl) return;
          if (gekozen.has(eis.id)) gekozen.delete(eis.id);
          else gekozen.add(eis.id);
          laden();
        },
      },
        el('span', {}, `${eis.position}. ${eis.title}`),
        el('span', { class: 'dim' },
          staatErAl ? 'staat er al' : aantal ? `${aantal} onderdelen` : ''));

      lijst.append(regel);
    }
    tekenVoet();
  };

  const toevoegen = async () => {
    const kiezen = eisenNu.filter((e) => gekozen.has(e.id));
    if (kiezen.length === 0) return;

    const onderdelen = vorm === 'onderdelen'
      ? check(await db.from('requirements').select('id, parent_id, position, title')
          .in('parent_id', kiezen.map((e) => e.id)).order('position'))
      : [];

    let position = vragen.length ? Math.max(...vragen.map((q) => q.position)) + 1 : 1;

    await run(async () => {
      const nieuwe = check(await db.from('exam_questions').insert(
        kiezen.map((eis) => ({
          exam_id: ex.id,
          position: position++,
          prompt: eis.title,
          kind: vorm === 'juist_onjuist' ? 'juist_onjuist' : 'meerkeuze',
          requirement_id: eis.id,
        })),
      ).select('id, requirement_id'));

      // De antwoorden erbij, zodat er zo min mogelijk te tikken valt. Welke goed
      // is laat ik leeg: dat weet alleen de instructeur, en een gokje van mij
      // zou stil in een examen belanden.
      const opties = [];
      for (const vraag of nieuwe) {
        if (vorm === 'juist_onjuist') {
          opties.push(
            { question_id: vraag.id, position: 1, label: 'Juist' },
            { question_id: vraag.id, position: 2, label: 'Onjuist' },
          );
        } else if (vorm === 'onderdelen') {
          const mijne = onderdelen.filter((o) => o.parent_id === vraag.requirement_id);
          mijne.forEach((o, i) => {
            opties.push({ question_id: vraag.id, position: i + 1, label: o.title });
          });
        }
      }
      if (opties.length) check(await db.from('exam_options').insert(opties));
    }, `${kiezen.length} ${kiezen.length === 1 ? 'vraag' : 'vragen'} toegevoegd`);

    render();
  };

  tekenKoppen();
  laden();

  return doos;
}

function vraagBlock(vraag, opties, buren, eis) {
  const wrap = el('div', { class: 'card', style: 'background:var(--bg)' });
  if (eis) {
    wrap.append(el('p', { class: 'dim', style: 'margin:0 0 6px' },
      `Hoort bij eis ${eis.position}: ${eis.title}`));
  }
  const tekst = field('Vraag', vraag.prompt, { multiline: true });
  const punten = field('Punten', vraag.points, { wrapClass: 'num' });
  punten.input.type = 'number';

  // Wisselen van plaats met een buur. De kolom is uniek per examen, dus de eerste
  // stap parkeert het nummer op een negatieve waarde; anders botst hij met zichzelf.
  const verplaats = async (richting) => {
    const i = buren.findIndex((q) => q.id === vraag.id);
    const buur = buren[i + richting];
    if (!buur) return;
    await run(async () => {
      check(await db.from('exam_questions').update({ position: -1 }).eq('id', vraag.id));
      check(await db.from('exam_questions').update({ position: vraag.position }).eq('id', buur.id));
      check(await db.from('exam_questions').update({ position: buur.position }).eq('id', vraag.id));
    }, 'Volgorde aangepast');
    render();
  };

  wrap.append(el('div', { class: 'row' },
    el('span', { class: 'dim' }, `${vraag.position}.`), tekst.wrap, punten.wrap,
    el('button', { class: 'btn ghost', onclick: () => verplaats(-1) }, '↑'),
    el('button', { class: 'btn ghost', onclick: () => verplaats(1) }, '↓'),
    el('button', {
      class: 'btn ghost',
      onclick: () => run(async () => check(await db.from('exam_questions').update({
        prompt: tekst.input.value.trim(),
        points: Math.max(1, Number(punten.input.value) || 1),
      }).eq('id', vraag.id)), 'Opgeslagen'),
    }, 'Opslaan'),
    el('button', {
      class: 'btn danger',
      onclick: async () => {
        if (!confirmed(`Vraag "${vraag.prompt}" verwijderen?`)) return;
        await run(async () => check(await db.from('exam_questions').delete().eq('id', vraag.id)), 'Verwijderd');
        render();
      },
    }, 'Verwijderen')));

  // Een plaatje bij de vraag: een verkeersteken, een knoop, een situatie op het
  // water. Het bestand gaat naar de opslag van Supabase; in de database staat
  // alleen het pad ernaartoe.
  const plaatje = el('div', { style: 'margin:8px 0' });
  if (vraag.image_path) {
    plaatje.append(el('img', {
      src: `${cfg.url}/storage/v1/object/public/examen/${vraag.image_path}`,
      alt: '', style: 'max-width:220px; border-radius:8px; display:block; margin-bottom:6px',
    }));
  }
  const kiesBestand = el('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp' });
  plaatje.append(el('div', { class: 'row' }, kiesBestand,
    el('button', {
      class: 'btn ghost',
      onclick: async () => {
        const bestand = kiesBestand.files?.[0];
        if (!bestand) return;
        const ext = (bestand.name.split('.').pop() ?? 'png').toLowerCase();
        const pad = `${vraag.exam_id}/${vraag.id}.${ext}`;
        await run(async () => {
          const op = await db.storage.from('examen').upload(pad, bestand, {
            upsert: true, contentType: bestand.type,
          });
          if (op.error) throw op.error;
          check(await db.from('exam_questions').update({ image_path: pad }).eq('id', vraag.id));
        }, 'Plaatje toegevoegd');
        render();
      },
    }, 'Plaatje uploaden'),
    vraag.image_path
      ? el('button', {
          class: 'btn danger',
          onclick: async () => {
            if (!confirmed('Het plaatje bij deze vraag weghalen?')) return;
            await run(async () => {
              await db.storage.from('examen').remove([vraag.image_path]);
              check(await db.from('exam_questions').update({ image_path: null }).eq('id', vraag.id));
            }, 'Weggehaald');
            render();
          },
        }, 'Plaatje weghalen')
      : null));
  wrap.append(plaatje);

  const waarschuwing = el('p', { class: 'note' },
    'Bij deze vraag staat nog geen goed antwoord aangevinkt. Zolang dat zo is, rekent hij hem altijd fout.');
  const toonWaarschuwing = () => {
    waarschuwing.classList.toggle('hidden', opties.some((o) => o.correct));
  };
  toonWaarschuwing();
  wrap.append(waarschuwing);

  // Eén tik markeert het goede antwoord, en de tekst bewaart zichzelf zodra je
  // uit het veld klikt. Aanvinken plus apart opslaan was twee handelingen te
  // veel voor iets wat je twintig keer per examen doet.
  for (const optie of opties) {
    const label = el('input', { value: optie.label });
    label.addEventListener('blur', () => {
      const tekst = label.value.trim();
      if (!tekst || tekst === optie.label) return;
      run(async () => check(await db.from('exam_options').update({ label: tekst })
        .eq('id', optie.id)), 'Opgeslagen');
      optie.label = tekst;
    });

    wrap.append(el('div', { class: 'part' },
      el('span', { class: 'dim' }, `${optie.position}.`), label,
      // Ter plekke bijwerken, niet het hele scherm opnieuw tekenen: bij twintig
      // vragen onder elkaar spring je anders elke tik terug naar boven.
      (() => {
        const knopje = chip(optie.correct ? 'goed' : 'fout', optie.correct, async () => {
          const nieuw = !optie.correct;
          await run(async () => check(await db.from('exam_options')
            .update({ correct: nieuw }).eq('id', optie.id)), nieuw ? 'Goed antwoord' : 'Niet meer goed');
          optie.correct = nieuw;
          knopje.textContent = nieuw ? 'goed' : 'fout';
          knopje.classList.toggle('on', nieuw);
          toonWaarschuwing();
        });
        return knopje;
      })(),
      el('button', {
        class: 'btn danger',
        onclick: async () => {
          if (!confirmed(`Antwoord "${optie.label}" verwijderen?`)) return;
          await run(async () => check(await db.from('exam_options').delete().eq('id', optie.id)), 'Verwijderd');
          render();
        },
      }, '×')));
  }

  const volgende = () => (opties.length ? Math.max(...opties.map((o) => o.position)) + 1 : 1);

  const nieuw = el('input', { placeholder: 'Nieuw antwoord' });
  const toevoegen = async (labels) => {
    let position = volgende();
    await run(async () => check(await db.from('exam_options').insert(
      labels.map((l) => ({ question_id: vraag.id, position: position++, label: l })),
    )), labels.length === 1 ? 'Antwoord toegevoegd' : 'Antwoorden toegevoegd');
    render();
  };

  nieuw.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && nieuw.value.trim()) toevoegen([nieuw.value.trim()]);
  });

  wrap.append(el('div', { class: 'part' }, nieuw,
    el('button', {
      class: 'btn',
      onclick: () => { if (nieuw.value.trim()) toevoegen([nieuw.value.trim()]); },
    }, 'Toevoegen')));

  // Twee veelgebruikte setjes, zodat je ze niet hoeft te typen.
  if (opties.length === 0) {
    wrap.append(el('div', { class: 'row', style: 'margin-top:6px; gap:6px' },
      el('span', { class: 'dim' }, 'Of zet er snel neer:'),
      chip('Juist / onjuist', false, () => toevoegen(['Juist', 'Onjuist'])),
      chip('Vier lege antwoorden', false, () =>
        toevoegen(['Antwoord 1', 'Antwoord 2', 'Antwoord 3', 'Antwoord 4']))));
  }

  return wrap;
}

function nieuweVraag(examId, vragen) {
  const tekst = el('input', { placeholder: 'Nieuwe vraag' });

  // Twee mogelijkheden zijn geen uitklaplijst waard; twee knoppen wel.
  const soort = { value: 'meerkeuze' };
  const rij = el('div', { class: 'row', style: 'gap:6px' });
  const tekenSoort = () => {
    rij.innerHTML = '';
    for (const [waarde, naam] of [['meerkeuze', 'Meerkeuze'], ['juist_onjuist', 'Juist / onjuist']]) {
      rij.append(chip(naam, soort.value === waarde, () => { soort.value = waarde; tekenSoort(); }));
    }
  };
  tekenSoort();

  return el('div', { class: 'row', style: 'margin:8px 0 4px' }, tekst, rij,
    el('button', {
      class: 'btn',
      onclick: async () => {
        if (!tekst.value.trim()) return;
        const position = vragen.length ? Math.max(...vragen.map((q) => q.position)) + 1 : 1;
        await run(async () => {
          const rijen = check(await db.from('exam_questions').insert({
            exam_id: examId, position, prompt: tekst.value.trim(), kind: soort.value,
          }).select('id'));
          // Juist/onjuist heeft maar één zinnig paar antwoorden; die zet het
          // scherm er meteen bij, zodat jij alleen nog hoeft aan te vinken welke
          // goed is.
          if (soort.value === 'juist_onjuist') {
            check(await db.from('exam_options').insert([
              { question_id: rijen[0].id, position: 1, label: 'Juist' },
              { question_id: rijen[0].id, position: 2, label: 'Onjuist' },
            ]));
          }
        }, 'Vraag toegevoegd');
        render();
      },
    }, 'Toevoegen'));
}

// ---- Examens: afnemen en meekijken
//
// Een sessie is één afname, met een code die je voorleest. Zolang hij open is
// ververst het overzicht zichzelf, zodat je op een groot scherm kunt zien wie
// binnen is en hoe ver iedereen is.

let examenTeller = null;

function stopMeekijken() {
  if (examenTeller) clearInterval(examenTeller);
  examenTeller = null;
}

function sessiesBlock(ex) {
  const doos = el('div', {});
  doos.append(el('h3', {}, 'Afnemen'));

  const label = field('Waarvoor (optioneel)', '', {});
  label.input.placeholder = 'Herfstkamp, dinsdagavond';
  const uren = field('Open voor (uur)', 6, { wrapClass: 'num' });
  uren.input.type = 'number';
  const uitslag = el('input', { type: 'checkbox' });
  uitslag.checked = true;
  const nakijken = el('input', { type: 'checkbox' });
  nakijken.checked = true;

  doos.append(el('div', { class: 'row' }, label.wrap, uren.wrap,
    el('label', { class: 'dim' }, uitslag, ' Deelnemer ziet zijn score'),
    el('label', { class: 'dim' }, nakijken, ' … en welke vragen goed waren'),
    el('button', {
      class: 'btn',
      onclick: async () => {
        await run(async () => check(await db.rpc('open_exam_session', {
          p_exam: ex.id,
          p_label: label.input.value.trim() || null,
          p_hours: Math.max(1, Math.min(24, Number(uren.input.value) || 6)),
          p_show_result: uitslag.checked,
          p_show_answers: nakijken.checked,
        })), 'Sessie geopend');
        render();
      },
    }, 'Sessie starten')));

  const lijst = el('div', { style: 'margin-top:12px' },
    el('p', { class: 'dim' }, 'Bezig met laden…'));
  doos.append(lijst);

  (async () => {
    const sessies = check(await db.from('exam_sessions').select('*')
      .eq('exam_id', ex.id).order('opened_at', { ascending: false }));
    lijst.innerHTML = '';
    if (sessies.length === 0) {
      lijst.append(el('p', { class: 'dim' }, 'Nog niet afgenomen.'));
      return;
    }
    for (const sessie of sessies) lijst.append(sessieBlock(sessie));
  })();

  return doos;
}

function sessieBlock(sessie) {
  const open = sessie.status === 'open' && new Date(sessie.closes_at) > new Date();
  const details = klapper(`sessie:${sessie.id}`,
    `${sessie.code} — ${sessie.label ?? 'zonder naam'} — ${open ? 'open' : 'gesloten'}`);

  const body = el('div', { style: 'margin-top:12px' });
  details.append(body);

  details.addEventListener('toggle', () => {
    stopMeekijken();
    if (!details.open) return;
    body.innerHTML = '';

    // De code groot, om voor te lezen of op een scherm te zetten.
    body.append(el('div', { class: 'card', style: 'text-align:center; background:var(--bg)' },
      el('div', { style: 'font-size:44px; font-weight:700; letter-spacing:.2em' }, sessie.code),
      el('p', { class: 'dim' }, open
        ? `Open tot ${new Date(sessie.closes_at).toLocaleString('nl-NL')}. Invullen kan op scoutingjwf.nl/cwo-examen/.`
        : 'Gesloten. Er kan niets meer bij.')));

    if (open) {
      body.append(el('div', { class: 'row' },
        el('button', {
          class: 'btn danger',
          onclick: async () => {
            if (!confirmed('Sessie sluiten?\n\nWie nog bezig is, kan niets meer inleveren.')) return;
            await run(async () => check(await db.rpc('close_exam_session', { p_session: sessie.id })), 'Gesloten');
            render();
          },
        }, 'Sessie sluiten')));
    }

    const tabel = el('div', { style: 'margin-top:12px' });
    body.append(tabel);

    // Alleen opnieuw tekenen als er iets veranderd is. Elke vier seconden de
    // lijst weggooien en opnieuw opbouwen betekende: opengeklapte antwoorden
    // dicht, en de pagina onder je vinger vandaan terwijl je aan het scrollen was.
    let vorige = '';

    const verversen = async () => {
      let rijen;
      try {
        rijen = check(await db.rpc('exam_session_overview', { p_session: sessie.id }));
      } catch (e) {
        stopMeekijken();
        tabel.innerHTML = '';
        tabel.append(el('p', { class: 'note' }, e.message ?? String(e)));
        return;
      }

      const nu = JSON.stringify(rijen);
      if (nu === vorige) return;
      vorige = nu;

      tabel.innerHTML = '';
      if (rijen.length === 0) {
        tabel.append(el('p', { class: 'dim' }, 'Nog niemand binnen.'));
        return;
      }
      for (const rij of rijen) tabel.append(deelnemerRij(rij, sessie));
    };

    verversen();
    // Alleen blijven kijken zolang er iets kan veranderen.
    if (open) examenTeller = setInterval(verversen, 4000);
  });

  return details;
}

function deelnemerRij(rij, sessie) {
  const klaar = rij.submitted_at !== null;
  const wrap = el('div', { class: 'card', style: 'background:var(--bg)' });

  wrap.append(el('div', { class: 'row' },
    el('b', {}, rij.display_name),
    el('span', { class: 'dim' },
      klaar
        ? `${rij.score} van ${rij.total}${rij.percent === null ? '' : ` — ${rij.percent}%`}`
        : `bezig — ${rij.beantwoord} van ${rij.vragen} beantwoord`),
    // De uitslag als pil, zodat je bij twintig deelnemers in één blik ziet wie
    // erdoor is. De grens komt uit het examen zelf.
    klaar
      ? el('span', {
          class: rij.geslaagd ? 'pil goed' : 'pil gezakt',
          title: `Geslaagd vanaf ${rij.grens}%`,
        }, rij.geslaagd ? 'geslaagd' : 'niet gehaald')
      : null,
    el('button', {
      class: 'btn ghost',
      onclick: async () => {
        const regels = check(await db.rpc('exam_attempt_detail', { p_attempt: rij.attempt_id }));
        const doos = el('div', { style: 'margin-top:8px' });
        for (const r of regels) {
          doos.append(el('div', { class: 'part' },
            el('span', { class: 'dim' }, `${r.position}.`),
            el('span', {}, r.prompt),
            el('span', { class: r.correct ? 'good' : 'dim' },
              (r.gekozen ?? 'niets') + (r.correct ? ' ✓' : ` (goed: ${r.juiste ?? '—'})`))));
        }
        wrap.append(doos);
      },
    }, 'Antwoorden'),
    el('button', {
      class: 'btn danger',
      onclick: async () => {
        if (!confirmed(`${rij.display_name} weghalen uit deze sessie?\n\nZijn antwoorden gaan mee.`)) return;
        await run(async () => check(await db.rpc('exam_attempt_remove', { p_attempt: rij.attempt_id })), 'Weggehaald');
        render();
      },
    }, 'Weghalen')));

  // Van uitslag naar vorderingenstaat. Pas zichtbaar als er iets te beoordelen
  // is: een ingeleverd examen van iemand die je hebt gekoppeld.
  if (klaar) {
    const aftekenen = el('div', {});
    wrap.append(el('div', { class: 'row', style: 'margin-top:8px' },
      el('button', {
        class: 'btn ghost',
        onclick: async () => {
          const eisen = await run(async () => check(await db.rpc('exam_attempt_requirements', {
            p_attempt: rij.attempt_id,
          })));
          aftekenen.innerHTML = '';

          if (eisen.length === 0) {
            aftekenen.append(el('p', { class: 'dim' },
              'Geen van de vragen hangt aan een eis. Koppel vragen aan eisen via "Vragen uit de eisenlijst".'));
            return;
          }

          const vakjes = [];
          for (const eis of eisen) {
            const aan = el('input', { type: 'checkbox' });
            aan.dataset.eis = eis.requirement_id;
            // Alles goed? Dan staat hij klaar om over te nemen. De rest vink je
            // zelf aan, want een half goede eis is jouw oordeel, niet dat van
            // een rekensom.
            aan.checked = eis.enrollment_id !== null && eis.goed === eis.vragen;
            aan.disabled = eis.enrollment_id === null;
            vakjes.push(aan);

            aftekenen.append(el('div', { class: 'part' },
              el('label', { class: aan.disabled ? 'dim' : '' },
                aan, ` ${eis.diploma_name} — ${eis.eis_position}. ${eis.eis_title}`),
              el('span', { class: eis.goed === eis.vragen ? 'good' : 'dim' },
                `${eis.goed} van ${eis.vragen} goed`),
              el('span', { class: 'dim' },
                eis.enrollment_id === null
                  ? 'werkt niet aan dit diploma'
                  : `nu: ${eis.huidige_status ?? 'niet behandeld'}`)));
          }

          aftekenen.append(el('div', { class: 'row', style: 'margin-top:10px' },
            el('button', {
              class: 'btn',
              onclick: async () => {
                const kiezen = vakjes.filter((v) => v.checked && !v.disabled)
                  .map((v) => v.dataset.eis);
                if (kiezen.length === 0) return;
                if (!confirmed(`${kiezen.length} ${kiezen.length === 1 ? 'eis' : 'eisen'} op gehaald zetten voor ${rij.display_name}?`)) return;
                await run(async () => check(await db.rpc('exam_sign_off_from_attempt', {
                  p_attempt: rij.attempt_id, p_requirements: kiezen, p_status: 'gehaald',
                })), 'Afgetekend');
                render();
              },
            }, 'Zet op gehaald'),
            el('span', { class: 'dim' }, 'Komt in de aftekenlijst te staan, met een notitie dat het uit dit examen komt.')));
        },
      }, 'Aftekenen')));
    wrap.append(aftekenen);
  }

  // Koppelen aan een vaarder, zodat je later weet wie deze Anouk was. Aftekenen
  // blijft handwerk: een fout in een vraag hoort niet vanzelf in een
  // vorderingenstaat te belanden.
  const kiezer = el('select', {}, el('option', { value: '' }, 'Niet gekoppeld'));
  kiezer.dataset.gevuld = '';
  kiezer.addEventListener('mousedown', async () => {
    if (kiezer.dataset.gevuld) return;
    kiezer.dataset.gevuld = '1';
    const leden = check(await db.rpc('group_members', { p_group: group.id }));
    for (const lid of leden) {
      kiezer.append(el('option',
        { value: lid.profile_id, selected: lid.profile_id === rij.profile_id },
        lid.full_name));
    }
  });
  kiezer.addEventListener('change', () => run(async () => check(await db.rpc('exam_attempt_link', {
    p_attempt: rij.attempt_id, p_profile: kiezer.value || null,
  })), 'Gekoppeld'));

  wrap.append(el('div', { class: 'row', style: 'margin-top:8px' },
    el('span', { class: 'dim' }, 'Hoort bij'), kiezer));

  return wrap;
}

// ---------------------------------------------------------------- start
paintAuthMode();
if (db) {
  // Een verlopen of al gebruikte link uit een mail komt terug met een fout in
  // plaats van sleutels. Dat moet in beeld, niet stil verdwijnen.
  if (linkInfo.error) {
    const box = document.getElementById('signin-error');
    box.textContent = /expired|invalid/i.test(linkInfo.error)
      ? 'Deze link is verlopen of al gebruikt. Vraag een nieuwe aan.'
      : linkInfo.error;
    box.classList.remove('hidden');
    if (linkInfo.recovery) { authMode = 'reset'; paintAuthMode(); box.classList.remove('hidden'); }
  }

  // getSession wacht tot supabase-js een eventuele link in de URL verwerkt heeft.
  db.auth.getSession().then(({ data }) => {
    if (!data.session) return;
    if (linkInfo.recovery) showNewPassword();
    else start();
  });
} else {
  document.getElementById('signin-error').textContent =
    'Geen Supabase-gegevens gevonden. Start deze pagina met "npm run admin" vanuit de projectmap.';
  document.getElementById('signin-error').classList.remove('hidden');
}
</script>
</body>
</html>
